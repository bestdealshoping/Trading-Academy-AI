<!DOCTYPE html>
<html lang="ht">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login | Trading Academy AI</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #1e3a8a
        );
}

.login-box {
    width: 92%;
    max-width: 420px;

    background: white;

    padding: 32px;

    border-radius: 18px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);
}

.logo {
    text-align: center;

    font-size: 24px;
    font-weight: bold;

    margin-bottom: 8px;
}

.logo span {
    color: #2563eb;
}

.subtitle {
    text-align: center;

    color: #64748b;

    margin-bottom: 28px;
}

label {
    display: block;

    margin-top: 15px;
    margin-bottom: 6px;

    font-weight: bold;
}

input {
    width: 100%;

    padding: 13px;

    border:
        1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;
}

button {
    width: 100%;

    margin-top: 22px;

    padding: 13px;

    border: 0;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

#message {
    margin-top: 18px;

    text-align: center;

    font-size: 14px;

    line-height: 1.5;
}

.back {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #64748b;

    text-decoration: none;
}

</style>

</head>


<body>


<div class="login-box">

    <div class="logo">
        Trading Academy <span>AI</span>
    </div>

    <div class="subtitle">
        🔐 Espace Administration
    </div>


    <form id="adminLoginForm">


        <label for="email">
            Email administrateur
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            required
        >


        <label for="password">
            Mot de passe
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >


        <button
            id="loginButton"
            type="submit">

            Se connecter

        </button>


    </form>


    <div id="message"></div>


    <a
        class="back"
        href="login.html">

        ← Retour connexion

    </a>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://jmkwekgpsogbdpkjqqyx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_b8t3rG-3ErqKmrhdTT0qYA_IOFHFLKP";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById(
    "adminLoginForm"
);

const button =
document.getElementById(
    "loginButton"
);

const message =
document.getElementById(
    "message"
);


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
"submit",
async function(event) {

    event.preventDefault();


    const email =
    document
        .getElementById("email")
        .value
        .trim();


    const password =
    document
        .getElementById("password")
        .value;


    button.disabled = true;

    message.textContent =
        "Connexion en cours...";


    try {


        /* ================================
           1. AUTH
        ================================= */

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            throw error;

        }


        const user =
            data.user;


        console.log(
            "AUTH USER:",
            user.id
        );


        /* ================================
           2. GET ROLE
        ================================= */

        const {
            data: userRoleRows,
            error: roleError
        } =
        await supabaseClient

        .from("user_roles")

        .select(`
            role_id,
            roles (
                id,
                name
            )
        `)

        .eq(
            "user_id",
            user.id
        );


        console.log(
            "ROLE ROWS:",
            userRoleRows
        );


        if (roleError) {

            console.error(
                "ROLE ERROR:",
                roleError
            );

            throw new Error(
                "Sistèm nan pa kapab verifye privilèj kont lan."
            );

        }


        if (
            !userRoleRows ||
            userRoleRows.length === 0
        ) {

            await supabaseClient
                .auth
                .signOut();


            throw new Error(
                "Kont sa a pa gen okenn privilèj administratè."
            );

        }


        /* ================================
           3. CHECK ROLE
        ================================= */

        const isAdmin =
        userRoleRows.some(
            row => {

                if (!row.roles) {
                    return false;
                }


                const roleName =
                row.roles.name
                    .trim()
                    .toLowerCase();


                console.log(
                    "ROLE:",
                    roleName
                );


                return (
                    roleName === "admin" ||
                    roleName === "super admin"
                );

            }
        );


        /* ================================
           4. DENIED
        ================================= */

        if (!isAdmin) {

            await supabaseClient
                .auth
                .signOut();


            throw new Error(
                "Accès refusé. Kont sa a pa administratè."
            );

        }


        /* ================================
           5. SUCCESS
        ================================= */

        message.textContent =
            "✅ Super Admin verifye. W ap antre...";


        setTimeout(
            function() {

                window.location.href =
                    "admin.html";

            },
            600
        );


    } catch (error) {


        console.error(
            "ADMIN LOGIN ERROR:",
            error
        );


        message.textContent =
            "❌ " +
            (
                error.message ||
                "Erè koneksyon."
            );


        button.disabled = false;

    }

});

</script>

</body>

</html>
