<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quiz — Trading Academy AI</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        body {
            background: #f5f7fb;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .quiz-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .quiz-header {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .quiz-header h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .quiz-description {
            color: #64748b;
            line-height: 1.6;
        }

        .progress {
            font-weight: bold;
            margin-top: 15px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 9px;
        }

        .question-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .question-number {
            font-size: 13px;
            font-weight: bold;
            color: #2563eb;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 20px;
            line-height: 1.5;
        }

        .option {
            display: block;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
            line-height: 1.5;
        }

        .option:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option input {
            margin-right: 10px;
        }

        .submit-btn,
        .retry-btn,
        .dashboard-btn {
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
            width: 100%;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .submit-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .retry-btn {
            background: #e9ecef;
            color: #111;
            margin-top: 15px;
        }

        .dashboard-btn {
            background: #111827;
            color: white;
            margin-top: 15px;
            margin-left: 8px;
        }

        .loading,
        .error {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .error {
            color: #b00020;
        }

        .result {
            background: white;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .result-score {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }

        .success {
            color: #16803c;
        }

        .failed {
            color: #c62828;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .hidden {
            display: none !important;
        }

        @media(max-width:600px) {

            .quiz-container {
                margin: 15px auto;
                padding: 12px;
            }

            .quiz-header,
            .question-card,
            .result {
                padding: 20px;
            }

            .question-text {
                font-size: 17px;
            }

            .result-score {
                font-size: 36px;
            }

            .dashboard-btn {
                margin-left: 0;
            }

        }

    </style>

</head>


<body>


<div class="quiz-container">


    <!-- =================================
         LOADING
    ================================== -->

    <div
        id="loading"
        class="loading">

        <h2>
            Chargement du quiz...
        </h2>

        <p>
            Préparation de votre évaluation.
        </p>

    </div>


    <!-- =================================
         ERROR
    ================================== -->

    <div
        id="error"
        class="error hidden">

        <h2>
            Accès refusé
        </h2>

        <p id="errorMessage"></p>

    </div>


    <!-- =================================
         QUIZ
    ================================== -->

    <div
        id="quizArea"
        class="hidden">


        <div class="quiz-header">

            <h1 id="quizTitle">
                Quiz
            </h1>

            <p
                id="quizDescription"
                class="quiz-description">

                Évaluation des connaissances.

            </p>

            <p>

                Répondez aux
                <strong>10 questions</strong>.

                <br>

                Une note minimale de
                <strong>70%</strong>
                est nécessaire pour réussir.

            </p>


            <div class="progress">

                Question
                <span id="currentQuestion">
                    1
                </span>

                /
                <span id="totalQuestions">
                    10
                </span>

            </div>

        </div>


        <form id="quizForm">

            <div
                id="questionsContainer">
            </div>


            <button
                type="submit"
                id="submitBtn"
                class="submit-btn">

                Soumettre le quiz

            </button>

        </form>

    </div>


    <!-- =================================
         RESULT
    ================================== -->

    <div
        id="resultArea"
        class="hidden">


        <div class="result">

            <h1 id="resultTitle"></h1>


            <div
                id="resultScore"
                class="result-score">

            </div>


            <p id="resultMessage"></p>


            <div class="result-box">

                <div class="result-row">

                    <span>
                        Bonnes réponses
                    </span>

                    <strong id="correctAnswers">
                        0
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        Mauvaises réponses
                    </span>

                    <strong id="wrongAnswers">
                        0
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        Note
                    </span>

                    <strong id="resultPercentage">
                        0%
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        XP gagné
                    </span>

                    <strong id="xpEarned">
                        0
                    </strong>

                </div>

            </div>


            <button
                id="retryBtn"
                class="retry-btn">

                🔄 Refaire le quiz

            </button>


            <button
                id="dashboardBtn"
                class="dashboard-btn">

                🏠 Retour au dashboard

            </button>

        </div>

    </div>


</div>


<!-- =================================
     SUPABASE
================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* ==========================================
   VARIABLES
========================================== */

let quizId = null;

let quizData = [];

let submitting = false;


/* ==========================================
   GET QUIZ ID
========================================== */

function getQuizId() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("quiz_id");

}

/* ==========================================
   INIT QUIZ
========================================== */

async function initQuiz() {

    try {

        /*
         * 1 — Récupérer ID quiz
         */

        quizId =
            getQuizId();


        if (!quizId) {

            throw new Error(
                "Aucun quiz sélectionné."
            );

        }


        /*
         * 2 — Vérifier utilisateur connecté
         */

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient
                .auth
                .getSession();


        if (sessionError) {

            throw sessionError;

        }


        if (
            !sessionData ||
            !sessionData.session
        ) {

            throw new Error(
                "Vous devez être connecté pour passer ce quiz."
            );

        }


        /*
         * 3 — Charger quiz
         */

        const {
            data: quiz,
            error: quizError
        } =
            await supabaseClient
                .from("quizzes")
                .select(`
                    id,
                    title,
                    description,
                    is_published
                `)
                .eq(
                    "id",
                    quizId
                )
                .eq(
                    "is_published",
                    true
                )
                .maybeSingle();


        if (quizError) {

            throw quizError;

        }


        if (!quiz) {

            throw new Error(
                "Quiz introuvable ou non publié."
            );

        }


        /*
         * 4 — Afficher informations quiz
         */

        document.getElementById(
            "quizTitle"
        ).textContent =
            quiz.title;


        document.getElementById(
            "quizDescription"
        ).textContent =
            quiz.description ||
            "Évaluation des connaissances.";


        /*
         * 5 — Start quiz côté serveur
         */

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "start_quiz",
                {
                    p_quiz_id:
                        quizId
                }
            );


        if (error) {

            throw error;

        }


        /*
         * Vérification
         */

        if (
            !data ||
            !Array.isArray(data)
        ) {

            throw new Error(
                "Le serveur n'a pas retourné les questions du quiz."
            );

        }


        if (
            data.length !== 10
        ) {

            throw new Error(
                "Le quiz doit contenir exactement 10 questions. Questions trouvées : " +
                data.length
            );

        }


        quizData =
            data;


        document.getElementById(
            "totalQuestions"
        ).textContent =
            quizData.length;


        renderQuestions();


        hide("loading");

        show("quizArea");


    }
    catch(error) {

        console.error(
            "ERREUR INIT QUIZ:",
            error
        );


        showError(
            error.message ||
            "Impossible de charger le quiz."
        );

    }

}


/* ==========================================
   RENDER QUESTIONS
========================================== */

function renderQuestions() {

    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML = "";


    quizData.forEach(
        (question, index) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "question-card";


            let optionsHTML = "";


            if (
                !question.options ||
                !Array.isArray(
                    question.options
                )
            ) {

                optionsHTML = `
                    <div class="error">
                        Aucune réponse disponible
                        pour cette question.
                    </div>
                `;

            }
            else {

                question.options.forEach(
                    option => {

                        optionsHTML += `

                            <label
                                class="option">

                                <input
                                    type="radio"
                                    name="question_${escapeHTML(question.id)}"
                                    value="${escapeHTML(option.id)}"
                                    required
                                >

                                ${escapeHTML(
                                    option.option_text
                                )}

                            </label>

                        `;

                    }
                );

            }


            card.innerHTML = `

                <div class="question-number">

                    QUESTION
                    ${index + 1}
                    /
                    ${quizData.length}

                </div>


                <div class="question-text">

                    ${escapeHTML(
                        question.question
                    )}

                </div>


                <div>

                    ${optionsHTML}

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );


    updateQuestionProgress();

}


/* ==========================================
   UPDATE QUESTION PROGRESS
========================================== */

function updateQuestionProgress() {

    const answered =
        quizData.filter(
            question => {

                return document.querySelector(
                    `input[name="question_${question.id}"]:checked`
                );

            }
        ).length;


    document.getElementById(
        "currentQuestion"
    ).textContent =
        Math.min(
            answered + 1,
            quizData.length
        );

}


/* ==========================================
   RADIO CHANGE
========================================== */

document.addEventListener(
    "change",
    function(event) {

        if (
            event.target.matches(
                '#questionsContainer input[type="radio"]'
            )
        ) {

            updateQuestionProgress();

        }

    }
);


/* ==========================================
   SUBMIT QUIZ
========================================== */

document.getElementById(
    "quizForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (submitting) {

            return;

        }


        submitting = true;


        const submitBtn =
            document.getElementById(
                "submitBtn"
            );


        submitBtn.disabled =
            true;


        submitBtn.textContent =
            "Correction en cours...";


        try {


            /*
             * Vérifier toutes les réponses
             */

            const answers = [];


            quizData.forEach(
                question => {


                    const selected =
                        document.querySelector(
                            `input[name="question_${question.id}"]:checked`
                        );


                    if (!selected) {

                        throw new Error(
                            "Veuillez répondre à toutes les questions."
                        );

                    }


                    answers.push({

                        question_id:
                            question.id,

                        option_id:
                            selected.value

                    });

                }
            );


            /*
             * Correction SERVER-SIDE
             */

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "submit_quiz",
                    {

                        p_quiz_id:
                            quizId,

                        p_answers:
                            answers

                    }
                );


            if (error) {

                throw error;

            }


            /*
             * Vérifier réponse serveur
             */

            if (!data) {

                throw new Error(
                    "Le serveur n'a retourné aucun résultat."
                );

            }


            showResult(
                data
            );


        }
        catch(error) {

            console.error(
                "ERREUR SUBMIT QUIZ:",
                error
            );


            alert(
                error.message ||
                "Une erreur est survenue pendant la correction."
            );


            submitBtn.disabled =
                false;


            submitBtn.textContent =
                "Soumettre le quiz";


            submitting =
                false;

        }

    }
);


/* ==========================================
   SHOW RESULT
========================================== */

function showResult(result) {

    hide("quizArea");

    show("resultArea");


    /*
     * Valeurs serveur
     */

    const total =
        Number(
            result.total_points ??
            result.total ??
            10
        );


    const score =
        Number(
            result.score ??
            result.correct_answers ??
            0
        );


    const percentage =
        Number(
            result.percentage ??
            (
                total > 0
                    ? Math.round(
                        (
                            score /
                            total
                        ) * 100
                    )
                    : 0
            )
        );


    const passed =
        Boolean(
            result.passed ??
            percentage >= 70
        );


    const xp =
        Number(
            result.xp_earned ??
            0
        );


    const correct =
        Number(
            result.correct_answers ??
            score
        );


    const wrong =
        Number(
            result.wrong_answers ??
            (
                total -
                correct
            )
        );


    /*
     * Score
     */

    document.getElementById(
        "resultScore"
    ).textContent =
        `${score}/${total} — ${percentage}%`;


    document.getElementById(
        "correctAnswers"
    ).textContent =
        correct;


    document.getElementById(
        "wrongAnswers"
    ).textContent =
        wrong;


    document.getElementById(
        "resultPercentage"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "xpEarned"
    ).textContent =
        xp;


    /*
     * Réussite
     */

    const title =
        document.getElementById(
            "resultTitle"
        );


    const scoreElement =
        document.getElementById(
            "resultScore"
        );


    const message =
        document.getElementById(
            "resultMessage"
        );


    if (passed) {

        title.textContent =
            "🎉 Félicitations !";


        title.className =
            "success";


        scoreElement.className =
            "result-score success";


        message.textContent =
            "Vous avez réussi le quiz. Note minimale : 70%.";

    }
    else {

        title.textContent =
            "❌ Quiz non réussi";


        title.className =
            "failed";


        scoreElement.className =
            "result-score failed";


        message.textContent =
            "Vous devez obtenir au minimum 70%. Vous pouvez retenter le quiz.";

    }

}


/* ==========================================
   RETRY
========================================== */

document.getElementById(
    "retryBtn"
).addEventListener(
    "click",
    function() {

        window.location.reload();

    }
);


/* ==========================================
   DASHBOARD
========================================== */

document.getElementById(
    "dashboardBtn"
).addEventListener(
    "click",
    function() {

        window.location.href =
            "dashboard.html";

    }
);


/* ==========================================
   SHOW
========================================== */

function show(id) {

    const element =
        document.getElementById(id);


    if (element) {

        element.classList.remove(
            "hidden"
        );

    }

}


/* ==========================================
   HIDE
========================================== */

function hide(id) {

    const element =
        document.getElementById(id);


    if (element) {

        element.classList.add(
            "hidden"
        );

    }

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    hide("loading");

    hide("quizArea");

    show("error");


    document.getElementById(
        "errorMessage"
    ).textContent =
        message;

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ==========================================
   START
========================================== */

initQuiz();

</script>

</body>

</html>
