<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://jmkwekgpsogbdpkjqqyx.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_b8t3rG-3ErqKmrhdTT0qYA_IOFHFLKP";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let allUsers = [];

let filteredUsers = [];

let selectedUser = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   GET FIRST EXISTING VALUE
===================================================== */

function getValue(
    object,
    keys,
    fallback = ""
){

    for(
        const key of keys
    ){

        if(
            object &&
            Object.prototype.hasOwnProperty.call(
                object,
                key
            ) &&
            object[key] !== null &&
            object[key] !== undefined &&
            object[key] !== ""
        ){

            return object[key];

        }

    }

    return fallback;

}


/* =====================================================
   USER NAME
===================================================== */

function getUserName(user){

    return getValue(
        user,
        [
            "name",
            "full_name",
            "username",
            "display_name",
            "nom",
            "first_name"
        ],
        "Utilisateur"
    );

}


/* =====================================================
   USER EMAIL
===================================================== */

function getUserEmail(user){

    return getValue(
        user,
        [
            "email",
            "mail"
        ],
        "Email non disponible"
    );

}


/* =====================================================
   USER STATUS
===================================================== */

function getUserStatus(user){

    const status =
        String(
            getValue(
                user,
                [
                    "status",
                    "statut",
                    "account_status"
                ],
                ""
            )
        )
        .toLowerCase();


    if(
        status.includes("ban") ||
        status.includes("block") ||
        status.includes("suspend")
    ){

        return "banned";

    }


    return "active";

}


/* =====================================================
   USER ROLE
===================================================== */

function getUserRole(user){

    return getValue(
        user,
        [
            "role",
            "user_role"
        ],
        "Utilisateur"
    );

}


/* =====================================================
   CREATED DATE
===================================================== */

function getCreatedDate(user){

    return getValue(
        user,
        [
            "created_at",
            "createdAt",
            "date_created"
        ],
        ""
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value){

        return "—";

    }


    const date =
        new Date(value);


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return escapeHTML(value);

    }


    return date.toLocaleDateString(
        "fr-FR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(name){

    const parts =
        String(name)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(!parts.length){

        return "U";

    }


    if(parts.length === 1){

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[1][0]
    ).toUpperCase();

}


/* =====================================================
   VERIFY ADMIN
===================================================== */

async function verifyAdmin(){

    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(
            error ||
            !data.user
        ){

            window.location.href =
                "admin-login.html";

            return false;

        }


        const user =
            data.user;


        const {
            data: userRoles,
            error: roleError
        } =
        await supabaseClient

            .from("user_roles")

            .select(`
                role_id,
                roles (
                    id,
                    name
                )
            `)

            .eq(
                "user_id",
                user.id
            );


        if(roleError){

            console.error(
                "ROLE ERROR:",
                roleError
            );

            window.location.href =
                "admin-login.html";

            return false;

        }


        const isAdmin =
        (userRoles || []).some(
            row => {

                if(!row.roles){

                    return false;

                }


                const role =
                String(
                    row.roles.name || ""
                )
                .trim()
                .toLowerCase();


                return (
                    role === "admin" ||
                    role === "super admin"
                );

            }
        );


        if(!isAdmin){

            window.location.href =
                "dashboard.html";

            return false;

        }


        document
            .getElementById("loading")
            .style.display = "none";


        document
            .getElementById("app")
            .style.display = "block";


        await loadUsers();


        return true;

    }
    catch(error){

        console.error(
            "VERIFY ADMIN ERROR:",
            error
        );


        window.location.href =
            "admin-login.html";

        return false;

    }

}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    const table =
        document.getElementById(
            "usersTable"
        );


    table.innerHTML = `

        <tr>

            <td colspan="6">

                <div class="empty">

                    Chargement des utilisateurs...

                </div>

            </td>

        </tr>

    `;


    try {

        const {
            data,
            error
        } =
        await supabaseClient

            .from("users")

            .select("*");


        if(error){

            throw error;

        }


        allUsers =
            Array.isArray(data)
            ? data
            : [];


        filteredUsers =
            [...allUsers];


        updateStatistics();

        applyFilters();

    }
    catch(error){

        console.error(
            "LOAD USERS ERROR:",
            error
        );


        table.innerHTML = `

            <tr>

                <td colspan="6">

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        Impossible de charger
                        les utilisateurs.

                        <br><br>

                        <small>
                            ${escapeHTML(
                                error.message ||
                                "Erreur inconnue"
                            )}
                        </small>

                    </div>

                </td>

            </tr>

        `;

        showToast(
            "Impossible de charger les utilisateurs."
        );

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

    const total =
        allUsers.length;


    const banned =
        allUsers.filter(
            user =>
                getUserStatus(user)
                === "banned"
        ).length;


    const active =
        total - banned;


    document
        .getElementById(
            "totalUsers"
        )
        .textContent =
            total;


    document
        .getElementById(
            "activeUsers"
        )
        .textContent =
            active;


    document
        .getElementById(
            "bannedUsers"
        )
        .textContent =
            banned;


    document
        .getElementById(
            "resultCount"
        )
        .textContent =
            filteredUsers.length;

}


/* =====================================================
   FILTERS
===================================================== */

function applyFilters(){

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const sort =
        document
            .getElementById(
                "sortFilter"
            )
            .value;


    filteredUsers =
        allUsers.filter(
            user => {

                const name =
                    getUserName(user)
                        .toLowerCase();


                const email =
                    getUserEmail(user)
                        .toLowerCase();


                const userStatus =
                    getUserStatus(user);


                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    email.includes(search);


                const matchesStatus =
                    status === "all" ||
                    userStatus === status;


                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    filteredUsers.sort(
        (a,b) => {

            if(sort === "name"){

                return getUserName(a)
                    .localeCompare(
                        getUserName(b)
                    );

            }


            const dateA =
                new Date(
                    getCreatedDate(a) || 0
                ).getTime();


            const dateB =
                new Date(
                    getCreatedDate(b) || 0
                ).getTime();


            if(sort === "oldest"){

                return dateA - dateB;

            }


            return dateB - dateA;

        }
    );


    updateStatistics();

    renderUsers();

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(){

    const table =
        document.getElementById(
            "usersTable"
        );


    if(!filteredUsers.length){

        table.innerHTML = `

            <tr>

                <td colspan="6">

                    <div class="empty">

                        <div class="empty-icon">
                            👥
                        </div>

                        Aucun utilisateur trouvé.

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    table.innerHTML = "";


    filteredUsers.forEach(
        user => {

            const id =
                getValue(
                    user,
                    ["id"],
                    ""
                );


            const name =
                getUserName(user);


            const email =
                getUserEmail(user);


            const status =
                getUserStatus(user);


            const role =
                getUserRole(user);


            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>

                    <div class="user-cell">

                        <div class="avatar">

                            ${escapeHTML(
                                getInitials(name)
                            )}

                        </div>


                        <div>

                            <div class="user-name">

                                ${escapeHTML(name)}

                            </div>


                            <div class="user-sub">

                                ID:
                                ${escapeHTML(
                                    id || "—"
                                )}

                            </div>

                        </div>

                    </div>

                </td>


                <td>

                    ${escapeHTML(email)}

                </td>


                <td>

                    ${
                        status === "banned"

                        ? `
                            <span class="badge badge-banned">
                                🚫 Banni
                            </span>
                          `

                        : `
                            <span class="badge badge-active">
                                🟢 Actif
                            </span>
                          `
                    }

                </td>


                <td>

                    ${escapeHTML(role)}

                </td>


                <td>

                    ${formatDate(
                        getCreatedDate(user)
                    )}

                </td>


                <td>

                    <div class="actions">

                        <button
                            class="action-btn action-view"
                            onclick="openUser('${escapeHTML(id)}')">

                            👁 Voir

                        </button>


                        <button
                            class="action-btn action-access"
                            onclick="manageAccess('${escapeHTML(id)}')">

                            🎓 Accès

                        </button>

                    </div>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =====================================================
   OPEN USER
===================================================== */

function openUser(id){

    selectedUser =
        allUsers.find(
            user =>
                String(user.id) ===
                String(id)
        );


    if(!selectedUser){

        showToast(
            "Utilisateur introuvable."
        );

        return;

    }


    const name =
        getUserName(selectedUser);


    const email =
        getUserEmail(selectedUser);


    const status =
        getUserStatus(selectedUser);


    const role =
        getUserRole(selectedUser);


    const created =
        getCreatedDate(selectedUser);


    const details =
        document.getElementById(
            "userDetails"
        );


    details.innerHTML = `

        <div class="user-cell"
             style="margin-bottom:20px;">

            <div
                class="avatar"
                style="
                    width:55px;
                    height:55px;
                    font-size:18px;
                ">

                ${escapeHTML(
                    getInitials(name)
                )}

            </div>


            <div>

                <div
                    class="user-name"
                    style="font-size:18px;">

                    ${escapeHTML(name)}

                </div>


                <div class="user-sub">

                    ${escapeHTML(email)}

                </div>

            </div>

        </div>


        <div class="detail-grid">


            <div class="detail">

                <div class="detail-label">
                    ID
                </div>

                <div class="detail-value">

                    ${escapeHTML(
                        selectedUser.id || "—"
                    )}

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Statut
                </div>

                <div class="detail-value">

                    ${
                        status === "banned"
                        ? "🚫 Banni"
                        : "🟢 Actif"
                    }

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Email
                </div>

                <div class="detail-value">

                    ${escapeHTML(email)}

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Rôle
                </div>

                <div class="detail-value">

                    ${escapeHTML(role)}

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Inscription
                </div>

                <div class="detail-value">

                    ${formatDate(created)}

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Champs disponibles
                </div>

                <div class="detail-value">

                    ${Object.keys(selectedUser).length}
                    champs

                </div>

            </div>


        </div>


        <div class="modal-actions">


            <button
                class="btn btn-primary"
                onclick="manageAccess('${escapeHTML(
                    selectedUser.id
                )}')">

                🎓 Gérer les accès

            </button>


            ${
                status === "banned"

                ? `
                    <button
                        class="btn btn-success"
                        onclick="requestUnban()">

                        🔓 Débannir

                    </button>
                  `

                : `
                    <button
                        class="btn btn-danger"
                        onclick="requestBan()">

                        🚫 Bannir

                    </button>
                  `
            }


        </div>


        <div
            style="
                margin-top:15px;
                padding:12px;
                background:#fff7ed;
                border:1px solid #fed7aa;
                border-radius:9px;
                color:#9a3412;
                font-size:12px;
            ">

            ℹ️ Les actions sensibles
            comme le bannissement et
            l'attribution d'accès seront
            connectées à la structure
            exacte de votre base de données
            avant toute modification.

        </div>

    `;


    document
        .getElementById("userModal")
        .classList
        .add("show");

}


/* =====================================================
   ACCESS MANAGEMENT
===================================================== */

function manageAccess(id){

    const user =
        allUsers.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!user){

        showToast(
            "Utilisateur introuvable."
        );

        return;

    }


    selectedUser =
        user;


    alert(
        "Gestion des accès pour " +
        getUserName(user) +
        " sera connectée à la structure exacte des accès aux cours."
    );

}


/* =====================================================
   BAN
===================================================== */

function requestBan(){

    if(!selectedUser){

        return;

    }


    alert(
        "Action de bannissement préparée pour " +
        getUserName(selectedUser) +
        ".\n\nNous ne modifions encore aucune colonne inconnue dans Supabase."
    );

}


/* =====================================================
   UNBAN
===================================================== */

function requestUnban(){

    if(!selectedUser){

        return;

    }


    alert(
        "Action de déblocage préparée pour " +
        getUserName(selectedUser) +
        ".\n\nNous ne modifions encore aucune colonne inconnue dans Supabase."
    );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document
        .getElementById("userModal")
        .classList
        .remove("show");

}


/* =====================================================
   RESET FILTERS
===================================================== */

function resetFilters(){

    document
        .getElementById("searchInput")
        .value = "";


    document
        .getElementById("statusFilter")
        .value = "all";


    document
        .getElementById("sortFilter")
        .value = "newest";


    applyFilters();

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add("show");


    setTimeout(
        () => {

            toast.classList.remove("show");

        },
        3000
    );

}


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        applyFilters
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        applyFilters
    );


document
    .getElementById("sortFilter")
    .addEventListener(
        "change",
        applyFilters
    );


/* =====================================================
   CLOSE MODAL OUTSIDE
===================================================== */

document
    .getElementById("userModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                closeModal();

            }

        }
    );


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "admin-login.html";

}


/* =====================================================
   START
===================================================== */

verifyAdmin();

</script>
