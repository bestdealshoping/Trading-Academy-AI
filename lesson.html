<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Lesson | Trading Academy AI</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fb;

    color:#172033;

}


header{

    background:#0f172a;

    color:white;

    padding:15px 18px;

    position:sticky;

    top:0;

    z-index:1000;

}


.header-inner{

    max-width:1100px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

}


.logo{

    font-size:19px;

    font-weight:800;

}


.logo span{

    color:#3b82f6;

}


.header-right{

    display:flex;

    align-items:center;

    gap:8px;

}


.language-select{

    border:1px solid
        rgba(255,255,255,.25);

    background:#1e293b;

    color:white;

    padding:8px 10px;

    border-radius:7px;

    font-size:13px;

}


.back-btn{

    border:0;

    background:#1e293b;

    color:white;

    padding:9px 12px;

    border-radius:7px;

    cursor:pointer;

}


.container{

    max-width:900px;

    margin:25px auto;

    padding:0 18px 80px;

}


.loading,
.error{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:35px;

    text-align:center;

}


.lesson-header{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    margin-bottom:18px;

}


.lesson-header h1{

    margin:0 0 10px;

    font-size:27px;

    line-height:1.3;

}


.lesson-description{

    color:#64748b;

    line-height:1.6;

    margin:0;

}


.lesson-meta{

    margin-top:15px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}


.badge{

    background:#eff6ff;

    color:#1d4ed8;

    border-radius:20px;

    padding:6px 10px;

    font-size:12px;

    font-weight:bold;

}


.content-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    margin-bottom:18px;

}


.content-card h2{

    margin:0 0 18px;

    font-size:20px;

}


.lesson-content{

    font-size:16px;

    line-height:1.8;

    color:#334155;

}


.lesson-content h1,
.lesson-content h2,
.lesson-content h3{

    color:#172033;

    line-height:1.4;

}


.lesson-content p{

    margin:0 0 16px;

}


.lesson-content ul,
.lesson-content ol{

    margin:0 0 18px;

    padding-left:25px;

}


.lesson-content li{

    margin-bottom:8px;

}


.lesson-content blockquote{

    margin:18px 0;

    padding:15px 18px;

    border-left:4px solid #2563eb;

    background:#eff6ff;

    color:#334155;

}


.lesson-content img{

    max-width:100%;

    height:auto;

    border-radius:10px;

}


.lesson-content table{

    width:100%;

    border-collapse:collapse;

    margin:18px 0;

}


.lesson-content th,
.lesson-content td{

    border:1px solid #e5e7eb;

    padding:10px;

    text-align:left;

}


.lesson-content th{

    background:#f8fafc;

}


.action-card{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:20px;

}


.progress-title{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-size:13px;

}


.progress{

    width:100%;

    height:9px;

    background:#e2e8f0;

    border-radius:20px;

    overflow:hidden;

}


.progress-bar{

    height:100%;

    width:0;

    background:#2563eb;

    transition:.4s;

}


.progress-complete{

    background:#16a34a;

}


.complete-message{

    color:#15803d;

    font-weight:bold;

    margin:0 0 15px;

}


.complete-btn{

    border:0;

    background:#16a34a;

    color:white;

    padding:12px 18px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

}


.complete-btn:hover{

    background:#15803d;

}


.complete-btn:disabled{

    opacity:.7;

    cursor:not-allowed;

}


.next-btn{

    border:0;

    background:#2563eb;

    color:white;

    padding:12px 18px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    margin-left:8px;

}


.next-btn:hover{

    background:#1d4ed8;

}


.message{

    margin-top:12px;

    font-size:13px;

}


@media(max-width:600px){

    .header{

        padding:12px;

    }


    .logo{

        font-size:15px;

    }


    .header-right{

        gap:5px;

    }


    .language-select{

        padding:7px;

        font-size:11px;

        max-width:95px;

    }


    .back-btn{

        padding:7px 9px;

        font-size:11px;

    }


    .container{

        margin:18px auto;

        padding:0 13px 60px;

    }


    .lesson-header{

        padding:20px;

    }


    .lesson-header h1{

        font-size:23px;

    }


    .content-card{

        padding:18px;

    }


    .lesson-content{

        font-size:15px;

    }


    .next-btn{

        margin-left:0;

        margin-top:8px;

    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">


<div class="logo">

Trading Academy <span>AI</span>

</div>


<div class="header-right">


<select
    id="languageSelect"
    class="language-select">

<option value="ht">
Kreyòl
</option>

<option value="fr">
Français
</option>

<option value="en">
English
</option>

</select>


<button
    class="back-btn"
    id="backButton">

← Cours

</button>


</div>

</div>

</header>



<main class="container">


<div id="content">

<div class="loading">

Chargement de la leçon...

</div>

</div>


</main>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */


const LESSON_SUPABASE_URL =
"https://jmkwekgpsogbdpkjqqyx.supabase.co";


const LESSON_SUPABASE_KEY =
"sb_publishable_b8t3rG-3ErqKmrhdTT0qYA_IOFHFLKP";


const lessonClient =
window.supabase.createClient(

    LESSON_SUPABASE_URL,

    LESSON_SUPABASE_KEY

);



/* =========================================================
   GLOBAL VARIABLES
========================================================= */


let currentUser = null;

let currentLesson = null;

let currentModule = null;

let currentCourse = null;

let currentProgress = null;

let currentLanguage = "ht";



/* =========================================================
   TRANSLATIONS OF INTERFACE
========================================================= */


const UI = {

    ht: {

        loading:
            "Ap chaje leson an...",

        error:
            "Li pa posib pou chaje leson an.",

        course:
            "← Cours",

        lesson:
            "Leson",

        module:
            "Modil",

        courseLabel:
            "Cours",

        progress:
            "Pwogrè",

        completed:
            "Leson sa a fini ✓",

        notCompleted:
            "Ou poko fini leson sa a.",

        completeButton:
            "✓ Make leson an fini",

        completedButton:
            "✓ Leson fini",

        saving:
            "Anrejistreman...",

        saved:
            "Pwogrè ou an anrejistre.",

        next:
            "Leson apre →",

        noContent:
            "Pa gen kontni disponib pou lang sa a.",

        lessonContent:
            "Kontni leson an"

    },


    fr: {

        loading:
            "Chargement de la leçon...",

        error:
            "Impossible de charger la leçon.",

        course:
            "← Cours",

        lesson:
            "Leçon",

        module:
            "Module",

        courseLabel:
            "Cours",

        progress:
            "Progression",

        completed:
            "Cette leçon est terminée ✓",

        notCompleted:
            "Vous n'avez pas encore terminé cette leçon.",

        completeButton:
            "✓ Marquer la leçon comme terminée",

        completedButton:
            "✓ Leçon terminée",

        saving:
            "Enregistrement...",

        saved:
            "Votre progression a été enregistrée.",

        next:
            "Leçon suivante →",

        noContent:
            "Aucun contenu disponible dans cette langue.",

        lessonContent:
            "Contenu de la leçon"

    },


    en: {

        loading:
            "Loading lesson...",

        error:
            "Unable to load the lesson.",

        course:
            "← Courses",

        lesson:
            "Lesson",

        module:
            "Module",

        courseLabel:
            "Course",

        progress:
            "Progress",

        completed:
            "This lesson is completed ✓",

        notCompleted:
            "You have not completed this lesson yet.",

        completeButton:
            "✓ Mark lesson as completed",

        completedButton:
            "✓ Lesson completed",

        saving:
            "Saving...",

        saved:
            "Your progress has been saved.",

        next:
            "Next lesson →",

        noContent:
            "No content is available in this language.",

        lessonContent:
            "Lesson content"

    }

};



/* =========================================================
   HELPERS
========================================================= */


function $(id){

    return document.getElementById(id);

}


function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/*
   Nou pèmèt HTML kontni leson an.
   Sa itil si admin lan mete <p>, <h2>,
   <ul>, <strong>, elatriye.
*/


function safeContent(value){

    if(!value){

        return "";

    }

    return String(value);

}


/*
   Jwenn ID leson an nan URL la.
*/


function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}



/* =========================================================
   LANGUAGE
========================================================= */


function getSavedLanguage(){

    const saved =
        localStorage.getItem(
            "trading_academy_language"
        );


    if(
        saved === "ht" ||
        saved === "fr" ||
        saved === "en"
    ){

        return saved;

    }


    return "ht";

}


function setLanguage(language){

    if(
        language !== "ht" &&
        language !== "fr" &&
        language !== "en"
    ){

        language = "ht";

    }


    currentLanguage =
        language;


    localStorage.setItem(

        "trading_academy_language",

        language

    );


    document.documentElement.lang =
        language;


    if(currentLesson){

        displayLesson();

    }

}



/* =========================================================
   AUTH
========================================================= */


async function getCurrentUser(){

    const {

        data,

        error

    } =
    await lessonClient
        .auth
        .getUser();


    if(error){

        throw error;

    }


    if(!data.user){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}



/* =========================================================
   LOAD LESSON
========================================================= */


async function loadLesson(){

    const lessonId =
        getLessonId();


    if(!lessonId){

        throw new Error(
            "ID de la leçon manquant."
        );

    }


    currentUser =
        await getCurrentUser();


    if(!currentUser){

        return;

    }


    /*
       LESSON
    */


    const {

        data:lesson,

        error:lessonError

    } =
    await lessonClient

        .from("lessons")

        .select("*")

        .eq(
            "id",
            lessonId
        )

        .maybeSingle();


    if(lessonError){

        throw lessonError;

    }


    if(!lesson){

        throw new Error(
            "Leçon introuvable."
        );

    }


    currentLesson =
        lesson;



    /*
       MODULE
    */


    if(lesson.module_id){

        const {

            data:module,

            error:moduleError

        } =
        await lessonClient

            .from("modules")

            .select(`
                id,
                course_id,
                module_number,
                title
            `)

            .eq(
                "id",
                lesson.module_id
            )

            .maybeSingle();


        if(moduleError){

            throw moduleError;

        }


        currentModule =
            module || null;

    }



    /*
       COURSE
    */


    if(currentModule?.course_id){

        const {

            data:course,

            error:courseError

        } =
        await lessonClient

            .from("courses")

            .select(`
                id,
                title,
                level,
                language
            `)

            .eq(
                "id",
                currentModule.course_id
            )

            .maybeSingle();


        if(courseError){

            throw courseError;

        }


        currentCourse =
            course || null;

    }



    /*
       USER PROGRESS
    */


    const {

        data:progress,

        error:progressError

    } =
    await lessonClient

        .from("user_lesson_progress")

        .select(`
            id,
            user_id,
            lesson_id,
            completed,
            completed_at
        `)

        .eq(
            "user_id",
            currentUser.id
        )

        .eq(
            "lesson_id",
            lessonId
        )

        .maybeSingle();


    if(progressError){

        throw progressError;

    }


    currentProgress =
        progress || null;



    displayLesson();

}



/* =========================================================
   GET TRANSLATED VALUE
========================================================= */


function translatedLessonField(
    baseName
){

    if(!currentLesson){

        return "";

    }


    /*
       Egzanp:
       title_ht
       title_fr
       title_en
    */


    const translatedKey =
        baseName +
        "_" +
        currentLanguage;


    const fallbackKey =
        baseName +
        "_ht";


    const translated =
        currentLesson[
            translatedKey
        ];


    const fallback =
        currentLesson[
            fallbackKey
        ];


    return (

        translated ||
        fallback ||
        currentLesson[baseName] ||
        ""

    );

}



/* =========================================================
   DISPLAY LESSON
========================================================= */


function displayLesson(){

    const ui =
        UI[currentLanguage];


    const title =
        translatedLessonField(
            "title"
        );


    const description =
        translatedLessonField(
            "description"
        );


    const content =
        translatedLessonField(
            "content"
        );


    const completed =
        currentProgress?.completed === true;


    const moduleTitle =
        currentModule
        ? (
            currentModule.title || ""
        )
        : "";


    const courseTitle =
        currentCourse
        ? (
            currentCourse.title || ""
        )
        : "";


    $("backButton").textContent =
        ui.course;



    $("content").innerHTML = `


        <section class="lesson-header">


            <h1>

                ${escapeHTML(
                    title ||
                    ui.lesson
                )}

            </h1>


            ${
                description

                ? `

                    <p class="lesson-description">

                        ${escapeHTML(
                            description
                        )}

                    </p>

                `

                : ""

            }


            <div class="lesson-meta">


                ${
                    currentCourse

                    ? `

                        <span class="badge">

                            ${escapeHTML(
                                ui.courseLabel
                            )}:

                            ${escapeHTML(
                                courseTitle
                            )}

                        </span>

                    `

                    : ""

                }


                ${
                    currentModule

                    ? `

                        <span class="badge">

                            ${escapeHTML(
                                ui.module
                            )}

                            ${escapeHTML(
                                currentModule.module_number
                                ? " " +
                                currentModule.module_number
                                : ""
                            )}

                            ${
                                moduleTitle
                                ? " · " +
                                escapeHTML(
                                    moduleTitle
                                )
                                : ""
                            }

                        </span>

                    `

                    : ""

                }


            </div>


        </section>



        <section class="content-card">


            <h2>

                ${escapeHTML(
                    ui.lessonContent
                )}

            </h2>


            <div class="lesson-content">


                ${
                    content

                    ? safeContent(
                        content
                    )

                    : `

                        <p>
                            ${escapeHTML(
                                ui.noContent
                            )}
                        </p>

                    `

                }


            </div>


        </section>



        <section class="action-card">


            <div class="progress-title">


                <span>

                    ${escapeHTML(
                        ui.progress
                    )}

                </span>


                <strong>

                    ${
                        completed
                        ? "100%"
                        : "0%"
                    }

                </strong>


            </div>


            <div class="progress">


                <div

                    class="progress-bar ${
                        completed
                        ? "progress-complete"
                        : ""
                    }"

                    style="
                        width:${
                            completed
                            ? 100
                            : 0
                        }%;
                    ">

                </div>


            </div>


            <div
                class="message"
                id="lessonMessage">

                ${
                    completed
                    ? escapeHTML(
                        ui.completed
                    )
                    : escapeHTML(
                        ui.notCompleted
                    )
                }

            </div>


            <div
                style="
                    margin-top:16px;
                ">


                <button

                    id="completeButton"

                    class="complete-btn"

                    ${
                        completed
                        ? "disabled"
                        : ""
                    }>


                    ${
                        completed
                        ? escapeHTML(
                            ui.completedButton
                        )
                        : escapeHTML(
                            ui.completeButton
                        )
                    }


                </button>


                <button

                    id="nextButton"

                    class="next-btn">


                    ${escapeHTML(
                        ui.next
                    )}


                </button>


            </div>


        </section>

    `;



    $("completeButton")
        .addEventListener(
            "click",
            completeLesson
        );


    $("nextButton")
        .addEventListener(
            "click",
            openNextLesson
        );

}



/* =========================================================
   COMPLETE LESSON
========================================================= */


async function completeLesson(){

    const button =
        $("completeButton");


    const message =
        $("lessonMessage");


    const ui =
        UI[currentLanguage];


    if(!currentLesson){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        ui.saving;


    try{


        /*
           Si progress existe,
           UPDATE li.
        */


        if(currentProgress){

            const {

                data,

                error

            } =
            await lessonClient

                .from(
                    "user_lesson_progress"
                )

                .update({

                    completed:true,

                    completed_at:
                        new Date()
                        .toISOString()

                })

                .eq(
                    "id",
                    currentProgress.id
                )

                .select()
                .maybeSingle();


            if(error){

                throw error;

            }


            currentProgress =
                data || {

                    completed:true

                };

        }


        /*
           Si pa gen progress,
           INSERT li.
        */


        else{

            const {

                data,

                error

            } =
            await lessonClient

                .from(
                    "user_lesson_progress"
                )

                .insert({

                    user_id:
                        currentUser.id,

                    lesson_id:
                        currentLesson.id,

                    completed:true,

                    completed_at:
                        new Date()
                        .toISOString()

                })

                .select()
                .maybeSingle();


            if(error){

                throw error;

            }


            currentProgress =
                data || {

                    completed:true

                };

        }


        /*
           Refresh display
        */


        displayLesson();


        const newMessage =
            $("lessonMessage");


        if(newMessage){

            newMessage.textContent =
                ui.saved;

        }


    }
    catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            ui.completeButton;


        message.textContent =
            error.message ||
            ui.error;

    }

}



/* =========================================================
   NEXT LESSON
========================================================= */


async function openNextLesson(){

    if(
        !currentLesson ||
        !currentModule
    ){

        window.location.href =
            "cours.html";

        return;

    }


    try{


        const {

            data:lessons,

            error

        } =
        await lessonClient

            .from("lessons")

            .select(`
                id,
                lesson_number
            `)

            .eq(
                "module_id",
                currentModule.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "lesson_number",
                {
                    ascending:true
                }
            );


        if(error){

            throw error;

        }


        const list =
            lessons || [];


        const currentIndex =
            list.findIndex(

                lesson =>
                    lesson.id ===
                    currentLesson.id

            );


        if(
            currentIndex >= 0 &&
            currentIndex <
            list.length - 1
        ){

            const nextLesson =
                list[
                    currentIndex + 1
                ];


            window.location.href =
                "lesson.html?id=" +
                encodeURIComponent(
                    nextLesson.id
                );


            return;

        }


        /*
           Si se dènye leson modil la,
           retounen sou cours.
        */


        window.location.href =
            "cours.html";

    }
    catch(error){

        console.error(
            "NEXT LESSON ERROR:",
            error
        );


        window.location.href =
            "cours.html";

    }

}



/* =========================================================
   BACK BUTTON
========================================================= */


$("backButton")
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "cours.html";

        }
    );



/* =========================================================
   LANGUAGE SELECT
========================================================= */


$("languageSelect")
    .addEventListener(
        "change",
        function(){

            setLanguage(
                this.value
            );

        }
    );



/* =========================================================
   INITIALIZE
========================================================= */


async function initialize(){

    currentLanguage =
        getSavedLanguage();


    $("languageSelect").value =
        currentLanguage;


    try{

        await loadLesson();

    }
    catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        const ui =
            UI[currentLanguage];


        $("content").innerHTML = `

            <div class="error">

                ❌

                ${escapeHTML(
                    ui.error
                )}

                <br><br>

                <small>

                    ${escapeHTML(
                        error.message ||
                        "Unknown error."
                    )}

                </small>

                <br><br>

                <button
                    class="back-btn"
                    onclick="
                        window.location.href='cours.html'
                    ">

                    ${escapeHTML(
                        ui.course
                    )}

                </button>

            </div>

        `;

    }

}


initialize();

</script>

</body>

</html>
