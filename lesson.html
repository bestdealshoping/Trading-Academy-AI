}

}

}

}

.container{

}

.loading,

    width:100%;

}

.progress-box{
    margin-top:30px;
    padding:22px;
    border-radius:18px;
    background:#f8fafc;
}

.status{
    font-weight:bold;
}

.status.completed{
    color:#15803d;
}

.status.pending{
    color:#d97706;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

button,

    text-decoration:none;

    border-radius:12px;
    font-weight:bold;
    font-size:15px;

.complete-btn{

.next-btn{

.quiz-btn{

.dashboard-btn{

    color:#111827;
}

.message{
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    display:none;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;

.course-progress{

.progress-track{
    width:100%;
    height:10px;
    background:#e5e7eb;
    border-radius:10px;
    overflow:hidden;

.progress-bar{

    background:#287cff;

    .actions a{
        width:100%;
        text-align:center;
    }

    .header-inner{
        align-items:flex-start;
    }

/* =========================================================
   DOM
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   LESSON ID
========================================================= */

function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("id") ||
        params.get("lesson_id")
    );

}


/* =========================================================
   GET USER
========================================================= */

async function getAuthenticatedUser(){

    if(!window.supabaseClient){

        throw new Error(
            UI[currentLanguage].supabaseMissing
        );

    }


    const {
        data,
        error
    } =
        await window.supabaseClient
            .auth
            .getUser();


    if(error){

        throw error;

    }


    if(
        !data ||
        !data.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}


/* =========================================================
   LOAD USER LANGUAGE
========================================================= */

async function chargerLangueUtilisateur(){

    const {
        data,
        error
    } =
        await window.supabaseClient

            .from("profils")

            .select("langue")

            .eq(
                "id",
                currentUser.id
            )

            .maybeSingle();


    if(error){

        console.warn(
            "LANGUAGE ERROR:",
            error
        );

        currentLanguage =
            "ht";

        return;

    }


    const lang =
        data?.langue;


    if(
        lang === "ht" ||
        lang === "fr" ||
        lang === "en"
    ){

        currentLanguage =
            lang;

    }
    else{

        currentLanguage =
            "ht";

    }


    updateLanguageButtons();

}


/* =========================================================
   CHANGE LANGUAGE
========================================================= */

async function changerLangue(lang){

    if(
        lang !== "ht" &&
        lang !== "fr" &&
        lang !== "en"
    ){

        return;

    }


    currentLanguage =
        lang;


    updateLanguageButtons();


    /*
       Save language preference
       in profiles.
    */

    try{

        const {
            error
        } =
            await window.supabaseClient

                .from("profils")

                .update({

                    langue:lang

                })

                .eq(
                    "id",
                    currentUser.id
                );


        if(error){

            console.warn(
                "LANGUAGE SAVE ERROR:",
                error
            );

        }

    }
    catch(error){

        console.warn(
            "LANGUAGE SAVE ERROR:",
            error
        );

    }


    /*
       Reload translated lesson
    */

    await afficherLecon();

    await afficherNavigation();

}


/* =========================================================
   LANGUAGE BUTTONS
========================================================= */

function updateLanguageButtons(){

    $("langHT")
        .classList
        .remove("active");

    $("langFR")
        .classList
        .remove("active");

    $("langEN")
        .classList
        .remove("active");


    if(currentLanguage === "ht"){

        $("langHT")
            .classList
            .add("active");

    }

    if(currentLanguage === "fr"){

        $("langFR")
            .classList
            .add("active");

    }

    if(currentLanguage === "en"){

        $("langEN")
            .classList
            .add("active");

    }

}


/* =========================================================
   TRANSLATION HELPER
========================================================= */

function t(key){

    return (
        UI[currentLanguage][key] ||
        UI.ht[key] ||
        key
    );

}


/* =========================================================
   LOAD TRANSLATIONS
========================================================= */

async function chargerTraductions(){

    /*
       LESSON TRANSLATION
    */

    const {
        data:lessonTranslation,
        error:lessonTranslationError
    } =
        await window.supabaseClient

            .from("lesson_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(lessonTranslationError){

        console.warn(
            "LESSON TRANSLATION ERROR:",
            lessonTranslationError
        );

    }


    /*
       MODULE TRANSLATION
    */

    const {
        data:moduleTranslation,
        error:moduleTranslationError
    } =
        await window.supabaseClient

            .from("module_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "module_id",
                currentModule.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(moduleTranslationError){

        console.warn(
            "MODULE TRANSLATION ERROR:",
            moduleTranslationError
        );

    }


    /*
       COURSE TRANSLATION
    */

    const {
        data:courseTranslation,
        error:courseTranslationError
    } =
        await window.supabaseClient

            .from("course_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(courseTranslationError){

        console.warn(
            "COURSE TRANSLATION ERROR:",
            courseTranslationError
        );

    }


    /*
       FALLBACK
    */

    currentLesson.displayTitle =
        lessonTranslation?.title ||
        currentLesson.title;


    currentLesson.displayDescription =
        lessonTranslation?.description ||
        currentLesson.description ||
        "";


    currentModule.displayTitle =
        moduleTranslation?.title ||
        currentModule.title;


    currentCourse.displayTitle =
        courseTranslation?.title ||
        currentCourse.title;

}


/* =========================================================
   LOAD LESSON
========================================================= */

async function chargerLecon(){

    try{

        if(!window.supabaseClient){

            throw new Error(
                t("supabaseMissing")
            );

        }


        const lessonId =
            getLessonId();


        if(!lessonId){

            throw new Error(
                t("noLesson")
            );

        }


        currentUser =
            await getAuthenticatedUser();


        if(!currentUser){

            return;

        }


        /*
           USER LANGUAGE
        */

        await chargerLangueUtilisateur();


        /*
           LESSON
        */

        const {
            data:lesson,
            error:lessonError
        } =
            await window.supabaseClient

                .from("lessons")

                .select(`
                    id,
                    module_id,
                    lesson_number,
                    title,
                    description,
                    video_url,
                    audio_url,
                    estimated_duration,
                    is_published
                `)

                .eq(
                    "id",
                    lessonId
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(lessonError){

            throw lessonError;

        }


        if(!lesson){

            throw new Error(
                t("lessonNotFound")
            );

        }


        currentLesson =
            lesson;


        /*
           MODULE
        */

        const {
            data:module,
            error:moduleError
        } =
            await window.supabaseClient

                .from("modules")

                .select(`
                    id,
                    course_id,
                    module_number,
                    title,
                    description,
                    is_published
                `)

                .eq(
                    "id",
                    lesson.module_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(moduleError){

            throw moduleError;

        }


        if(!module){

            throw new Error(
                t("moduleNotFound")
            );

        }


        currentModule =
            module;


        /*
           COURSE
        */

        const {
            data:course,
            error:courseError
        } =
            await window.supabaseClient

                .from("courses")

                .select(`
                    id,
                    title,
                    description,
                    level,
                    language,
                    is_published
                `)

                .eq(
                    "id",
                    module.course_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(courseError){

            throw courseError;

        }


        if(!course){

            throw new Error(
                t("courseNotFound")
            );

        }


        currentCourse =
            course;


        /*
           TRANSLATIONS
        */

        await chargerTraductions();


        /*
           PROGRESS
        */

        await chargerProgression();


        /*
           COURSE LESSONS
        */

        await chargerLeconsCours();


        /*
           DISPLAY
        */

        await afficherLecon();

        await afficherProgression();

        await afficherNavigation();


        $("loading")
            .classList
            .add("hidden");


        $("lessonPage")
            .classList
            .remove("hidden");

    }

    catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        showError(
            error.message ||
            String(error)
        );

    }

}


/* =========================================================
   CURRENT PROGRESS
========================================================= */

async function chargerProgression(){

    const {
        data,
        error
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(`
                id,
                user_id,
                lesson_id,
                completed,
                completed_at,
                created_at
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .maybeSingle();


    if(error){

        throw error;

    }


    currentProgress =
        data || null;

}


/* =========================================================
   COURSE LESSONS
========================================================= */

async function chargerLeconsCours(){

    const {
        data:modules,
        error:moduleError
    } =
        await window.supabaseClient

            .from("modules")

            .select(`
                id,
                course_id,
                module_number,
                is_published
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "module_number",
                {
                    ascending:true
                }
            );


    if(moduleError){

        throw moduleError;

    }


    const moduleList =
        modules || [];


    if(
        moduleList.length === 0
    ){

        courseLessons = [];

        return;

    }


    const moduleIds =
        moduleList.map(
            module =>
                module.id
        );


    const {
        data:lessons,
        error:lessonError
    } =
        await window.supabaseClient

            .from("lessons")

            .select(`
                id,
                module_id,
                lesson_number,
                title,
                is_published
            `)

            .in(
                "module_id",
                moduleIds
            )

            .eq(
                "is_published",
                true
            );


    if(lessonError){

        throw lessonError;

    }


    courseLessons =
        lessons || [];


    const moduleOrder = {};


    moduleList.forEach(
        module => {

            moduleOrder[
                module.id
            ] =
                Number(
                    module.module_number
                ) || 0;

        }
    );


    courseLessons.sort(
        (
            a,
            b
        ) => {

            const moduleA =
                moduleOrder[
                    a.module_id
                ] || 0;

            const moduleB =
                moduleOrder[
                    b.module_id
                ] || 0;


            if(
                moduleA !== moduleB
            ){

                return moduleA - moduleB;

            }


            return (
                Number(a.lesson_number) || 0
            ) -
            (
                Number(b.lesson_number) || 0
            );

        }
    );


    currentIndex =
        courseLessons.findIndex(
            lesson =>
                lesson.id ===
                currentLesson.id
        );

}

/* =========================================================
   VIDEO
========================================================= */

function afficherVideo(){

    const container =
        $("videoContainer");

    const video =
        $("lessonVideo");

    const link =
        $("videoLink");


    if(!currentLesson.video_url){

        container.classList.add(
            "hidden"
        );

        return;

    }


    const url =
        String(
            currentLesson.video_url
        ).trim();


    container.classList.remove(
        "hidden"
    );


    if(
        /\.(mp4|webm|ogg)(\?.*)?$/i
            .test(url)
    ){

        video.src =
            url;

        video.classList.remove(
            "hidden"
        );

        link.classList.add(
            "hidden"
        );

    }

    else{

        video.classList.add(
            "hidden"
        );

        link.href =
            url;

        link.textContent =
            t("openVideo");

        link.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   AUDIO
========================================================= */

function afficherAudio(){

    const box =
        $("audioBox");

    const audio =
        $("lessonAudio");


    if(!currentLesson.audio_url){

        box.classList.add(
            "hidden"
        );

        return;

    }


    box.classList.remove(
        "hidden"
    );


    audio.src =
        currentLesson.audio_url;

}


/* =========================================================
   STATUS
========================================================= */

function afficherStatut(){

    const button =
        $("completeButton");

    const status =
        $("statusText");

    const headerStatus =
        $("lessonStatus");


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        button.textContent =
            t("completedLesson");


        button.disabled =
            true;


        status.textContent =
            t("completedLesson");


        status.className =
            "status completed";


        headerStatus.textContent =
            t("completed");


        headerStatus.style.background =
            "#dcfce7";

        headerStatus.style.color =
            "#166534";

    }

    else{

        button.textContent =
            t("markComplete");


        button.disabled =
            false;


        status.textContent =
            t("notCompleted");


        status.className =
            "status pending";


        headerStatus.textContent =
            t("inProgress");


        headerStatus.style.background =
            "";

        headerStatus.style.color =
            "";

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

async function afficherNavigation(){

    const nextButton =
        $("nextButton");

    const quizButton =
        $("quizButton");


    nextButton.classList.add(
        "hidden"
    );

    quizButton.classList.add(
        "hidden"
    );


    if(currentIndex === -1){

        return;

    }


    /*
       NEXT LESSON
    */

    if(
        currentIndex <
        courseLessons.length - 1
    ){

        const nextLesson =
            courseLessons[
                currentIndex + 1
            ];


        nextButton.href =
            "lesson.html?id=" +
            encodeURIComponent(
                nextLesson.id
            );


        nextButton.textContent =
            t("next");


        nextButton.classList.remove(
            "hidden"
        );


        return;

    }


    /*
       LAST LESSON
    */

    if(
        courseLessons.length === 0
    ){

        return;

    }


    const lessonIds =
        courseLessons.map(
            lesson =>
                lesson.id
        );


    const {
        data:progress,
        error:progressError
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(`
                lesson_id,
                completed
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .in(
                "lesson_id",
                lessonIds
            );


    if(progressError){

        console.error(
            "PROGRESS CHECK ERROR:",
            progressError
        );

        return;

    }


    const completedIds =
        new Set(
            (progress || [])
                .filter(
                    row =>
                        row.completed === true
                )
                .map(
                    row =>
                        row.lesson_id
                )
        );


    const allCompleted =
        courseLessons.every(
            lesson =>
                completedIds.has(
                    lesson.id
                )
        );


    if(!allCompleted){

        return;

    }


    /*
       FINAL COURSE QUIZ
    */

    const {
        data:quiz,
        error:quizError
    } =
        await window.supabaseClient

            .from("quizzes")

            .select(`
                id,
                course_id,
                lesson_id
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .is(
                "lesson_id",
                null
            )

            .eq(
                "is_published",
                true
            )

            .limit(1)
            .maybeSingle();


    if(quizError){

        console.error(
            "QUIZ SEARCH ERROR:",
            quizError
        );

        return;

    }


    if(!quiz){

        return;

    }


    quizButton.href =
        "quiz.html?id=" +
        encodeURIComponent(
            quiz.id
        );


    quizButton.textContent =
        t("quiz");


    quizButton.classList.remove(
        "hidden"
    );

}


/* =========================================================
   COMPLETE LESSON
========================================================= */

async function terminerLecon(){

    const button =
        $("completeButton");

    const message =
        $("actionMessage");


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        t("saving");


    message.className =
        "message";

    message.textContent =
        "";


    try{


        const {
            data:existing,
            error:existingError
        } =
            await window.supabaseClient

                .from(
                    "user_lesson_progress"
                )

                .select("id")

                .eq(
                    "user_id",
                    currentUser.id
                )

                .eq(
                    "lesson_id",
                    currentLesson.id
                )

                .maybeSingle();


        if(existingError){

            throw existingError;

        }


        let saved;


        if(existing){

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .update({

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    })

                    .eq(
                        "id",
                        existing.id
                    )

                    .select()
                    .single();


            if(error){

                throw error;

            }


            saved =
                data;

        }

        else{

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .insert({

                        user_id:
                            currentUser.id,

                        lesson_id:
                            currentLesson.id,

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    })

                    .select()
                    .single();


            if(error){

                throw error;

            }


            saved =
                data;

        }


        currentProgress =
            saved;


        afficherStatut();


        message.textContent =
            t("success");


        message.className =
            "message success";


        await afficherProgression();

        await afficherNavigation();

    }

    catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            t("markComplete");


        message.textContent =
            (
                currentLanguage === "ht"
                ? "❌ Li pa posib pou anrejistre: "
                : currentLanguage === "fr"
                ? "❌ Impossible d'enregistrer : "
                : "❌ Unable to save: "
            ) +
            (
                error.message ||
                error
            );


        message.className =
            "message error";

    }

}


/* =========================================================
   COURSE PROGRESS
========================================================= */

async function afficherProgression(){

    try{

        if(
            !currentCourse ||
            courseLessons.length === 0
        ){

            return;

        }


        const lessonIds =
            courseLessons.map(
                lesson =>
                    lesson.id
            );


        const {
            data,
            error
        } =
            await window.supabaseClient

                .from(
                    "user_lesson_progress"
                )

                .select(`
                    lesson_id,
                    completed
                `)

                .eq(
                    "user_id",
                    currentUser.id
                )

                .in(
                    "lesson_id",
                    lessonIds
                );


        if(error){

            throw error;

        }


        const completed =
            (data || [])
                .filter(
                    row =>
                        row.completed === true
                )
                .length;


        const total =
            courseLessons.length;


        const percentage =
            total === 0
            ? 0
            : Math.round(
                (
                    completed /
                    total
                ) * 100
            );


        $("progressBar")
            .style
            .width =
            percentage + "%";


        $("progressText")
            .textContent =
            completed +
            " / " +
            total +
            " " +
            t("lessonProgress") +
            " — " +
            percentage +
            "%";

    }

    catch(error){

        console.error(
            "COURSE PROGRESS ERROR:",
            error
        );

    }

}

$("completeButton")
