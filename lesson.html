<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lesson | Trading Academy AI</title>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f7fb;

    color:#172033;
}


/* =========================
   HEADER
========================= */

header{

    background:#0f172a;

    color:white;

    padding:16px 20px;

    position:sticky;

    top:0;

    z-index:1000;
}


.header-inner{

    max-width:1000px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;
}


.logo{

    font-size:19px;

    font-weight:800;
}


.logo span{

    color:#3b82f6;
}


.header-actions{

    display:flex;

    align-items:center;

    gap:8px;
}


.back-btn,
.language-btn{

    border:0;

    background:#1e293b;

    color:white;

    padding:9px 12px;

    border-radius:8px;

    cursor:pointer;

}


.back-btn:hover,
.language-btn:hover{

    background:#334155;
}


/* =========================
   MAIN
========================= */

.container{

    max-width:900px;

    margin:25px auto;

    padding:
        0 18px 80px;
}


/* =========================
   LOADING
========================= */

.loading{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:40px;

    text-align:center;

    color:#64748b;
}


/* =========================
   ERROR
========================= */

.error{

    background:#fef2f2;

    border:1px solid #fecaca;

    color:#991b1b;

    border-radius:12px;

    padding:20px;

}


/* =========================
   LESSON HEADER
========================= */

.lesson-header{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    margin-bottom:18px;
}


.lesson-number{

    color:#2563eb;

    font-size:13px;

    font-weight:bold;

    margin-bottom:8px;
}


.lesson-header h1{

    margin:0;

    font-size:28px;

    line-height:1.3;
}


.lesson-description{

    color:#64748b;

    margin-top:10px;

    line-height:1.6;
}


/* =========================
   LANGUAGE
========================= */

.language-box{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:12px;

    padding:14px;

    margin-bottom:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;
}


.language-label{

    font-size:13px;

    font-weight:bold;

    color:#475569;
}


.language-select{

    border:1px solid #cbd5e1;

    padding:9px 12px;

    border-radius:8px;

    background:white;

    color:#172033;

    cursor:pointer;
}


/* =========================
   CONTENT
========================= */

.lesson-content{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:28px;

    margin-bottom:18px;

    line-height:1.8;

    white-space:pre-line;
}


.lesson-content h2{

    margin-top:0;
}


.content-title{

    font-size:18px;

    font-weight:bold;

    margin-bottom:18px;

    color:#172033;
}


/* =========================
   VIDEO
========================= */

.media-box{

    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:20px;

    margin-bottom:18px;
}


.media-box h2{

    margin:
        0 0 15px;

    font-size:18px;
}


video{

    width:100%;

    max-height:500px;

    border-radius:10px;

    background:#000;
}


/* =========================
   AUDIO
========================= */

audio{

    width:100%;
}


/* =========================
   COMPLETE
========================= */

.complete-box{

    background:#eff6ff;

    border:1px solid #bfdbfe;

    border-radius:15px;

    padding:22px;

    text-align:center;

    margin-top:20px;
}


.complete-box h2{

    margin:
        0 0 8px;
}


.complete-box p{

    color:#475569;

    font-size:14px;

    margin-bottom:18px;
}


.complete-btn{

    border:0;

    background:#2563eb;

    color:white;

    padding:13px 20px;

    border-radius:9px;

    font-weight:bold;

    cursor:pointer;
}


.complete-btn:hover{

    background:#1d4ed8;
}


.complete-btn.completed{

    background:#16a34a;

    cursor:default;
}


/* =========================
   NAVIGATION
========================= */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:20px;
}


.nav-btn{

    flex:1;

    border:1px solid #dbe3ee;

    background:white;

    color:#172033;

    padding:12px;

    border-radius:9px;

    cursor:pointer;

    font-weight:bold;
}


.nav-btn:hover{

    border-color:#2563eb;

    background:#eff6ff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        padding:14px;
    }


    .header-inner{

        flex-wrap:wrap;
    }


    .logo{

        font-size:16px;
    }


    .back-btn,
    .language-btn{

        padding:8px 10px;

        font-size:12px;
    }


    .container{

        padding:
            0 13px 70px;
    }


    .lesson-header{

        padding:20px;
    }


    .lesson-header h1{

        font-size:23px;
    }


    .lesson-content{

        padding:20px;

        font-size:15px;
    }


    .language-box{

        align-items:flex-start;

        flex-direction:column;
    }


    .language-select{

        width:100%;
    }


    .navigation{

        flex-direction:column;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-inner">


        <div class="logo">

            Trading Academy
            <span>AI</span>

        </div>


        <div class="header-actions">


            <button
                class="language-btn"
                onclick="goBack()">

                ← Cours

            </button>


        </div>


    </div>

</header>



<main class="container">


    <div
        id="content">

        <div class="loading">

            Chargement de la leçon...

        </div>

    </div>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const LESSON_SUPABASE_URL =
    "https://jmkwekgpsogbdpkjqqyx.supabase.co";


const LESSON_SUPABASE_KEY =
    "sb_publishable_b8t3rG-3ErqKmrhdTT0qYA_IOFHFLKP";


const lessonClient =
    window.supabase.createClient(
        LESSON_SUPABASE_URL,
        LESSON_SUPABASE_KEY
    );


/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;

let currentLesson = null;

let currentTranslation = null;

let allTranslations = [];

let currentLanguage = "ht";


/* =========================================================
   LANGUAGE CONFIG
========================================================= */

const LANGUAGES = {

    ht: {

        name:"Kreyòl",

        code:"ht"

    },

    fr: {

        name:"Français",

        code:"fr"

    },

    en: {

        name:"English",

        code:"en"

    }

};


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   GET LESSON ID
========================================================= */

function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get("id");

}


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await lessonClient
            .auth
            .getUser();


    if(
        error ||
        !data.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}


/* =========================================================
   LOAD LESSON
========================================================= */

async function loadLesson(){

    const lessonId =
        getLessonId();


    if(!lessonId){

        showError(
            "ID de la leçon manquant."
        );

        return;

    }


    try{

        /* -----------------------------------------
           USER
        ----------------------------------------- */

        currentUser =
            await getCurrentUser();


        if(!currentUser){

            return;

        }


        /* -----------------------------------------
           LESSON
        ----------------------------------------- */

        const {
            data:lesson,
            error:lessonError
        } =
        await lessonClient

            .from("lessons")

            .select(`
                id,
                module_id,
                lesson_number,
                title,
                description,
                video_url,
                audio_url,
                estimated_duration,
                is_published
            `)

            .eq(
                "id",
                lessonId
            )

            .eq(
                "is_published",
                true
            )

            .maybeSingle();


        if(lessonError){

            throw lessonError;

        }


        if(!lesson){

            throw new Error(
                "Leçon introuvable ou non publiée."
            );

        }


        currentLesson =
            lesson;


        /* -----------------------------------------
           TRANSLATIONS
        ----------------------------------------- */

        const {
            data:translations,
            error:translationError
        } =
        await lessonClient

            .from("lesson_translations")

            .select(`
                id,
                lesson_id,
                language_code,
                title,
                description
            `)

            .eq(
                "lesson_id",
                lesson.id
            );


        if(translationError){

            throw translationError;

        }


        allTranslations =
            translations || [];


        /* -----------------------------------------
           SAVED LANGUAGE
        ----------------------------------------- */

        const savedLanguage =
            localStorage.getItem(
                "academy_language"
            );


        if(
            savedLanguage &&
            LANGUAGES[savedLanguage]
        ){

            currentLanguage =
                savedLanguage;

        }
        else{

            currentLanguage =
                "ht";

        }


        /* -----------------------------------------
           PROGRESS
        ----------------------------------------- */

        await loadProgress();


        /* -----------------------------------------
           DISPLAY
        ----------------------------------------- */

        displayLesson();

    }
    catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        showError(
            error.message ||
            "Impossible de charger la leçon."
        );

    }

}


/* =========================================================
   GET TRANSLATION
========================================================= */

function getTranslation(languageCode){

    return allTranslations.find(
        translation =>
            String(
                translation.language_code
            )
            .toLowerCase()
            .trim()
            === languageCode
    );

}


/* =========================================================
   SELECT CONTENT
========================================================= */

function getLessonContent(){

    const translation =
        getTranslation(
            currentLanguage
        );


    if(translation){

        currentTranslation =
            translation;


        return {

            title:
                translation.title ||
                currentLesson.title,

            description:
                translation.description ||
                currentLesson.description

        };

    }


    /*
       Si la traduction pa egziste,
       nou retounen sou tèks original la.
    */

    currentTranslation =
        null;


    return {

        title:
            currentLesson.title,

        description:
            currentLesson.description

    };

}


/* =========================================================
   DISPLAY LESSON
========================================================= */

function displayLesson(){

    const content =
        document.getElementById(
            "content"
        );


    const lessonContent =
        getLessonContent();


    const translatedTitle =
        escapeHTML(
            lessonContent.title
        );


    const translatedDescription =
        escapeHTML(
            lessonContent.description
        );


    const isCompleted =
        currentLesson.completed === true;


    let videoHTML = "";


    if(currentLesson.video_url){

        videoHTML = `

            <section class="media-box">

                <h2>
                    🎥 Vidéo
                </h2>

                <video
                    controls
                    preload="metadata">

                    <source
                        src="${escapeHTML(
                            currentLesson.video_url
                        )}">

                </video>

            </section>

        `;

    }


    let audioHTML = "";


    if(currentLesson.audio_url){

        audioHTML = `

            <section class="media-box">

                <h2>
                    🎧 Audio
                </h2>

                <audio
                    controls>

                    <source
                        src="${escapeHTML(
                            currentLesson.audio_url
                        )}">

                </audio>

            </section>

        `;

    }


    content.innerHTML = `

        <!-- LANGUAGE -->

        <section class="language-box">

            <div class="language-label">

                🌐 Langue de la leçon

            </div>


            <select
                id="languageSelect"
                class="language-select"
                onchange="changeLanguage(this.value)">

                <option
                    value="ht"
                    ${
                        currentLanguage === "ht"
                        ? "selected"
                        : ""
                    }>

                    Kreyòl

                </option>


                <option
                    value="fr"
                    ${
                        currentLanguage === "fr"
                        ? "selected"
                        : ""
                    }>

                    Français

                </option>


                <option
                    value="en"
                    ${
                        currentLanguage === "en"
                        ? "selected"
                        : ""
                    }>

                    English

                </option>

            </select>

        </section>



        <!-- LESSON HEADER -->

        <section class="lesson-header">


            <div class="lesson-number">

                LESSON
                ${escapeHTML(
                    currentLesson.lesson_number
                )}

            </div>


            <h1>

                ${translatedTitle}

            </h1>


            ${
                currentLesson.estimated_duration
                ?
                `
                    <div class="lesson-description">

                        ⏱️
                        ${escapeHTML(
                            currentLesson
                                .estimated_duration
                        )}
                        minutes

                    </div>
                `
                :
                ""
            }


        </section>



        <!-- VIDEO -->

        ${videoHTML}



        <!-- AUDIO -->

        ${audioHTML}



        <!-- CONTENT -->

        <section class="lesson-content">


            <div class="content-title">

                📖 Contenu de la leçon

            </div>


            ${translatedDescription}


        </section>



        <!-- COMPLETE -->

        <section class="complete-box">


            ${
                isCompleted

                ?

                `

                    <h2>
                        ✓ Leçon terminée
                    </h2>

                    <p>

                        Cette leçon est déjà
                        enregistrée comme terminée.

                    </p>


                    <button
                        class="complete-btn completed"
                        disabled>

                        ✓ Terminée

                    </button>

                `

                :

                `

                    <h2>
                        🎯 Terminer la leçon
                    </h2>

                    <p>

                        Après avoir étudié cette leçon,
                        cliquez sur le bouton ci-dessous
                        pour enregistrer votre progression.

                    </p>


                    <button
                        id="completeButton"
                        class="complete-btn"
                        onclick="completeLesson()">

                        ✓ Marquer comme terminée

                    </button>

                `

            }


        </section>



        <!-- NAVIGATION -->

        <div class="navigation">


            <button
                class="nav-btn"
                onclick="goBack()">

                ← Mes cours

            </button>


            <button
                class="nav-btn"
                onclick="window.scrollTo({
                    top:0,
                    behavior:'smooth'
                })">

                ↑ Haut de page

            </button>


        </div>

    `;

}


/* =========================================================
   CHANGE LANGUAGE
========================================================= */

function changeLanguage(languageCode){

    if(
        !LANGUAGES[languageCode]
    ){

        return;

    }


    currentLanguage =
        languageCode;


    localStorage.setItem(
        "academy_language",
        languageCode
    );


    displayLesson();

}


/* =========================================================
   LOAD PROGRESS
========================================================= */

async function loadProgress(){

    const {
        data,
        error
    } =
    await lessonClient

        .from("user_lesson_progress")

        .select(`
            id,
            completed,
            completed_at
        `)

        .eq(
            "user_id",
            currentUser.id
        )

        .eq(
            "lesson_id",
            currentLesson.id
        )

        .maybeSingle();


    if(error){

        throw error;

    }


    currentLesson.completed =
        data?.completed === true;


    currentLesson.progressId =
        data?.id || null;

}


/* =========================================================
   COMPLETE LESSON
========================================================= */

async function completeLesson(){

    const button =
        document.getElementById(
            "completeButton"
        );


    if(!button){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "Enregistrement...";


    try{

        const {
            data,
            error
        } =
        await lessonClient

            .from("user_lesson_progress")

            .upsert(

                {

                    user_id:
                        currentUser.id,

                    lesson_id:
                        currentLesson.id,

                    completed:
                        true,

                    completed_at:
                        new Date().toISOString()

                },

                {

                    onConflict:
                        "user_id,lesson_id"

                }

            )

            .select()
            .maybeSingle();


        if(error){

            throw error;

        }


        currentLesson.completed =
            true;


        currentLesson.progressId =
            data?.id ||
            currentLesson.progressId;


        displayLesson();


    }
    catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        alert(
            "Impossible d'enregistrer la progression : " +
            (
                error.message ||
                "Erreur inconnue."
            )
        );


        button.disabled =
            false;


        button.textContent =
            "✓ Marquer comme terminée";

    }

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href =
        "mes_cours.html";

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="error">

            ❌

            ${escapeHTML(
                message
            )}

            <br><br>

            <button
                class="complete-btn"
                onclick="goBack()">

                ← Retour aux cours

            </button>

        </div>

    `;

}


/* =========================================================
   START
========================================================= */

loadLesson();

</script>


</body>

</html>
