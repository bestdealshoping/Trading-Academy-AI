<!DOCTYPE html>
<html lang="ht">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lesson | Trading Academy AI</title>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}


/* ==============================
   HEADER
============================== */

header{
    background:#0f172a;
    color:white;
    padding:16px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1000px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:19px;
    font-weight:800;
}

.logo span{
    color:#3b82f6;
}


/* ==============================
   HEADER BUTTONS
============================== */

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.back-btn{
    border:0;
    background:#1e293b;
    color:white;

    padding:9px 13px;

    border-radius:8px;

    cursor:pointer;
}

.back-btn:hover{
    background:#334155;
}


/* ==============================
   LANGUAGE
============================== */

.language-select{
    border:1px solid #475569;

    background:#1e293b;

    color:white;

    padding:8px 10px;

    border-radius:8px;

    cursor:pointer;

    outline:none;
}


/* ==============================
   CONTAINER
============================== */

.container{
    max-width:900px;

    margin:25px auto;

    padding:0 18px 60px;
}


/* ==============================
   LOADING
============================== */

.loading{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:40px;

    text-align:center;

    color:#64748b;
}


/* ==============================
   ERROR
============================== */

.error{
    background:#fef2f2;

    border:1px solid #fecaca;

    color:#991b1b;

    border-radius:12px;

    padding:20px;

    text-align:center;
}


/* ==============================
   LESSON HEADER
============================== */

.lesson-header{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    margin-bottom:18px;
}

.lesson-number{
    color:#2563eb;

    font-size:12px;

    font-weight:bold;

    text-transform:uppercase;

    margin-bottom:8px;
}

.lesson-title{
    margin:0;

    font-size:28px;

    line-height:1.25;
}

.lesson-description{
    color:#64748b;

    line-height:1.6;

    margin-top:12px;
}


/* ==============================
   PROGRESS
============================== */

.progress-card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:18px;

    margin-bottom:18px;
}

.progress-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:8px;

    font-size:13px;
}

.progress-percent{
    color:#2563eb;

    font-weight:bold;
}

.progress{
    width:100%;

    height:9px;

    background:#e2e8f0;

    border-radius:20px;

    overflow:hidden;
}

.progress-fill{
    height:100%;

    width:0;

    background:#2563eb;

    transition:.3s;
}

.progress-fill.completed{
    background:#16a34a;
}


/* ==============================
   CONTENT
============================== */

.lesson-content{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    margin-bottom:18px;
}

.lesson-content h2{
    margin:0 0 18px;

    font-size:19px;
}

.content-text{
    color:#334155;

    font-size:16px;

    line-height:1.8;

    white-space:pre-line;
}


/* ==============================
   VIDEO
============================== */

.video-box{
    margin-top:20px;
}

.video-box video{
    width:100%;

    max-height:500px;

    border-radius:12px;

    background:#000;
}


/* ==============================
   AUDIO
============================== */

.audio-box{
    margin-top:20px;

    padding:16px;

    background:#f8fafc;

    border-radius:10px;
}

.audio-box audio{
    width:100%;
}


/* ==============================
   COMPLETE
============================== */

.complete-card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:22px;

    margin-bottom:18px;

    text-align:center;
}

.complete-message{
    color:#64748b;

    font-size:14px;

    margin-bottom:15px;
}

.complete-btn{
    border:0;

    background:#2563eb;

    color:white;

    padding:13px 20px;

    border-radius:9px;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;
}

.complete-btn:hover{
    background:#1d4ed8;
}

.complete-btn.completed{
    background:#16a34a;

    cursor:default;
}


/* ==============================
   NAVIGATION
============================== */

.navigation{
    display:flex;

    justify-content:space-between;

    gap:10px;
}

.nav-btn{
    border:1px solid #d1d5db;

    background:white;

    color:#172033;

    padding:11px 15px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.nav-btn:hover{
    background:#f8fafc;

    border-color:#2563eb;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    header{
        padding:13px 14px;
    }

    .logo{
        font-size:15px;
    }

    .header-inner{
        gap:8px;
    }

    .header-actions{
        gap:5px;
    }

    .back-btn{
        padding:8px 9px;

        font-size:11px;
    }

    .language-select{
        padding:7px 6px;

        font-size:11px;
    }

    .container{
        margin:18px auto;

        padding:0 13px 50px;
    }

    .lesson-header{
        padding:19px;
    }

    .lesson-title{
        font-size:23px;
    }

    .lesson-content{
        padding:19px;
    }

    .content-text{
        font-size:15px;
    }

    .navigation{
        flex-direction:column;
    }

    .nav-btn{
        width:100%;
    }

}

</style>

   SUPABASE CONFIG
========================================= */

"https://jmkwekgpsogbdpkjqqyx.supabase.co";

            "ID de la leçon introuvable.",

        saved:
            "Leçon marquée comme terminée.",

        saveError:
            "Impossible d'enregistrer la progression."

/* =========================================
   GET LESSON ID
========================================= */

function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
        await lessonClient
            .auth
            .getUser();


    if(error){

        throw error;

    }


    if(!data.user){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

    const {
        data,
        error
    } =
        await lessonClient

            .from("profils")

            .select(`
                id,
                nom_complet,
                username,
                langue,
                niveau,
                progression,
                lecons_terminees,
                xp,
                actif
            `)

            .eq(
                "id",
                currentUser.id
            )

            .maybeSingle();


    if(error){

        throw error;

    }


    if(!data){

        throw new Error(
            "Profil étudiant introuvable."
        );

    }


    currentProfile =
        data;


    currentLanguage =
        normalizeLanguage(
            data.langue
        );


    document
        .getElementById(
            "languageSelect"
        )
        .value =
            currentLanguage;

}


/* =========================================
   NORMALIZE LANGUAGE
========================================= */

function normalizeLanguage(language){

    const value =
        String(
            language || "ht"
        )
        .toLowerCase()
        .trim();


    if(
        value === "fr" ||
        value === "french" ||
        value === "français" ||
        value === "francais"
    ){

        return "fr";

    }


    if(
        value === "en" ||
        value === "english"
    ){

        return "en";

    }


    return "ht";

}


/* =========================================
   LOAD LESSON
========================================= */

async function loadLesson(){

    const lessonId =
        getLessonId();


    if(!lessonId){

        throw new Error(
            UI[currentLanguage].noLesson
        );

    }


    /* -----------------------------------------
       LESSON BASE
    ----------------------------------------- */

    const {
        data:lesson,
        error:lessonError
    } =
        await lessonClient

            .from("lessons")

            .select(`
                id,
                module_id,
                lesson_number,
                title,
                description,
                video_url,
                audio_url,
                estimated_duration,
                is_published
            `)

            .eq(
                "id",
                lessonId
            )

            .eq(
                "is_published",
                true
            )

            .maybeSingle();


    if(lessonError){

        throw lessonError;

    }


    if(!lesson){

        throw new Error(
            "Lesson introuvable ou non publiée."
        );

    }


    currentLesson =
        lesson;


    /* -----------------------------------------
       TRANSLATION
    ----------------------------------------- */

    await loadLessonTranslation();


    /* -----------------------------------------
       PROGRESS
    ----------------------------------------- */

    await loadLessonProgress();


    /* -----------------------------------------
       DISPLAY
    ----------------------------------------- */

    displayLesson();

}


/* =========================================
   LOAD LESSON TRANSLATION
========================================= */

async function loadLessonTranslation(){

    const {
        data:translations,
        error
    } =
        await lessonClient

            .from("lesson_translations")

            .select(`
                id,
                lesson_id,
                language_code,
                title,
                description
            `)

            .eq(
                "lesson_id",
                currentLesson.id
            );


    if(error){

        throw error;

    }


    const selected =
        (
            translations || []
        ).find(
            item =>
                item.language_code ===
                currentLanguage
        );


    const fallbackHT =
        (
            translations || []
        ).find(
            item =>
                item.language_code === "ht"
        );


    const fallbackFR =
        (
            translations || []
        ).find(
            item =>
                item.language_code === "fr"
        );


    const fallbackEN =
        (
            translations || []
        ).find(
            item =>
                item.language_code === "en"
        );


    currentTranslation =
        selected ||
        fallbackHT ||
        fallbackFR ||
        fallbackEN ||
        null;

}


/* =========================================
   LOAD PROGRESS
========================================= */

async function loadLessonProgress(){

    const {
        data,
        error
    } =
        await lessonClient

            .from("user_lesson_progress")

            .select(`
                id,
                user_id,
                lesson_id,
                completed,
                completed_at
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .limit(1);


    if(error){

        throw error;

    }


    isCompleted =
        data &&
        data.length > 0 &&
        data[0].completed === true;

}

        <!-- NAVIGATION -->

                ←
                ${escapeHTML(

                )}

                class="nav-btn"

}


/* =========================================
   MARK LESSON COMPLETED
========================================= */

async function markLessonCompleted(){

    if(isCompleted){

        return;

    }


    const button =
        document.getElementById(
            "completeButton"
        );


    if(button){

        button.disabled =
            true;

        button.textContent =
            "Enregistrement...";

    }


    try{


        /*
         * On vérifie d'abord s'il existe
         * déjà une ligne de progression.
         */

        const {
            data:existing,
            error:existingError
        } =
            await lessonClient

                .from("user_lesson_progress")

                .select(`
                    id
                `)

                .eq(
                    "user_id",
                    currentUser.id
                )

                .eq(
                    "lesson_id",
                    currentLesson.id
                )

                .limit(1);


        if(existingError){

            throw existingError;

        }


        if(
            existing &&
            existing.length > 0
        ){

            /*
             * La ligne existe.
             * Nou mete completed = true.
             */

            const {
                error:updateError
            } =
                await lessonClient

                    .from(
                        "user_lesson_progress"
                    )

                    .update({

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    })

                    .eq(
                        "id",
                        existing[0].id
                    );


            if(updateError){

                throw updateError;

            }

        }
        else{

            /*
             * Aucune ligne.
             * Nou kreye li.
             */

            const {
                error:insertError
            } =
                await lessonClient

                    .from(
                        "user_lesson_progress"
                    )

                    .insert({

                        user_id:
                            currentUser.id,

                        lesson_id:
                            currentLesson.id,

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    });


            if(insertError){

                throw insertError;

            }

        }


        isCompleted =
            true;


        /*
         * Nou mete UI a ajou.
         */

        updateCompletedUI();


        /*
         * Nou montre yon mesaj.
         */

        alert(
            UI[currentLanguage].saved
        );


    }
    catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        alert(
            UI[currentLanguage].saveError +
            "\n\n" +
            (
                error.message ||
                "Erreur inconnue."
            )
        );


        if(button){

            button.disabled =
                false;

            button.textContent =
                UI[currentLanguage]
                    .markCompleted;

        }

    }

}


/* =========================================
   UPDATE COMPLETED UI
========================================= */

function updateCompletedUI(){

    const ui =
        UI[currentLanguage];


    const percent =
        document.getElementById(
            "progressPercent"
        );


    const fill =
        document.getElementById(
            "progressFill"
        );


    const message =
        document.getElementById(
            "completeMessage"
        );


    const button =
        document.getElementById(
            "completeButton"
        );


    if(percent){

        percent.textContent =
            "100%";

    }


    if(fill){

        fill.style.width =
            "100%";

        fill.classList.add(
            "completed"
        );

    }


    if(message){

        message.textContent =
            ui.completed;

    }


    if(button){

        button.disabled =
            true;

        button.classList.add(
            "completed"
        );

        button.textContent =
            ui.alreadyCompleted;

    }

}


/* =========================================
   CHANGE LANGUAGE
========================================= */

async function changeLanguage(language){

    currentLanguage =
        normalizeLanguage(
            language
        );


    /*
     * Nou mete lang lan nan profils.
     */

    try{

        const {
            error
        } =
            await lessonClient

                .from("profils")

                .update({

                    langue:
                        currentLanguage

                })

                .eq(
                    "id",
                    currentUser.id
                );


        if(error){

            console.warn(
                "LANGUAGE SAVE ERROR:",
                error
            );

        }

    }
    catch(error){

        console.warn(
            "LANGUAGE ERROR:",
            error
        );

    }


    /*

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

/* =========================================
   INITIALIZE
========================================= */

async function initializeLesson(){

    const content =
        document.getElementById(
            "content"
        );


    try{

        currentUser =
            await getCurrentUser();


        if(!currentUser){

            return;

        }


        await loadProfile();


        await loadLesson();

    }
    catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        content.innerHTML = `

            <div class="error">

                <strong>

                    ${
                        escapeHTML(
                            UI[currentLanguage]
                                .error
                        )
                    }

                </strong>


                <br><br>


                <small>

                    ${
                        escapeHTML(
                            error.message ||
                            "Erreur inconnue."
                        )
                    }

                </small>

            </div>

        `;

    }

}


/* =========================================
   START
========================================= */

initializeLesson();
