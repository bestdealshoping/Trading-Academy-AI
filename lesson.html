<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:#f3f6fb;
    color:#111827;
}

.header{
    background:#071226;
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;

    display:flex;
    align-items:center;

}

}

}

.header-actions{

}

.language-select{

    color:white;

    padding:10px 12px;
    border-radius:9px;

    cursor:pointer;
}

.back{
    display:inline-block;

    padding:10px 15px;

}

}

.loading,

.breadcrumb{

.video-link{

.content{

.description{

.audio-box{

.progress-box{

.actions{
    display:flex;

    gap:12px;

    margin-top:25px;

button,
.action-link{
    border:none;

    text-decoration:none;

    cursor:pointer;

    padding:15px 20px;

    border-radius:12px;

    font-weight:bold;

    font-size:15px;

.complete-btn{
    background:#16a34a;

    color:white;
}

.complete-btn:disabled{

    cursor:default;
}

.next-btn{
    background:#287cff;

    color:white;
}

.quiz-btn{
    background:#7c3aed;

    color:white;
}

.dashboard-btn{
    background:#e5e7eb;

}

.message{

    padding:13px;

    border-radius:10px;

    display:none;
}

.message.success{
    display:block;

    background:#dcfce7;

    color:#166534;
}

.message.error{
    display:block;

    background:#fee2e2;

    color:#991b1b;
}

.course-progress{
    margin-top:30px;
}

.progress-track{
    width:100%;

    height:10px;

    background:#e5e7eb;

    border-radius:10px;

    overflow:hidden;

.progress-bar{
    height:100%;

    }

    }

/*
=========================================================
   GET LANGUAGE
=========================================================
*/

function getLanguage(){

    if(
        !LANGUAGES[currentLanguage]
    ){

        currentLanguage = "ht";

    }

    return LANGUAGES[
        currentLanguage
    ];
}


/*
=========================================================
   APPLY INTERFACE LANGUAGE
=========================================================
*/

function applyInterfaceLanguage(){

    const t =
        getLanguage();


    document.documentElement.lang =
        t.htmlLang;


    document.title =
        currentLanguage === "ht"
        ? "Leson | Trading Academy AI"
        : currentLanguage === "en"
        ? "Lesson | Trading Academy AI"
        : "Leçon | Trading Academy AI";


    document.getElementById(
        "backButton"
    ).textContent =
        t.back;


    document.getElementById(
        "aboutTitle"
    ).textContent =
        t.about;


    document.getElementById(
        "audioTitle"

    document.getElementById(
        "coursesButton"

        t.courses;


    document.getElementById(
        "courseProgressTitle"

    document.getElementById(
        "nextButton"

        t.next;


    document.getElementById(
        "quizButton"
    ).textContent =
        t.quiz;


    document.getElementById(
        "loading"
    ).textContent =
        t.loading;


    afficherStatut();

}


/*
=========================================================
   ESCAPE HTML
=========================================================
*/

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/*
=========================================================
   GET LESSON ID
=========================================================
*/

function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("id");

}


/*
=========================================================
   ERROR
=========================================================
*/

function showError(message){

    document
        .getElementById("loading")
        .classList.add("hidden");


    const box =
        document.getElementById(
            "errorBox"
        );


    box.textContent =
        message;


    box.classList.remove(
        "hidden"
    );

}


/*
=========================================================
   AUTH
=========================================================
*/

async function getAuthenticatedUser(){

    const {
        data:sessionData,
        error:sessionError
    } =
        await window.supabaseClient
            .auth
            .getSession();


    if(sessionError){

        throw sessionError;

    }


    if(
        !sessionData ||
        !sessionData.session
    ){

        window.location.href =
            "login.html";

        return null;

    }


    const {
        data:userData,
        error:userError
    } =
        await window.supabaseClient
            .auth
            .getUser();


    if(userError){

        throw userError;

    }


    if(
        !userData ||
        !userData.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return userData.user;

}


/*
=========================================================
   LOAD STUDENT LANGUAGE
=========================================================
*/

async function loadStudentLanguage(){

    const {
        data,
        error
    } =
        await window.supabaseClient

            .from("profils")

            .select("langue")

            .eq(
                "id",
                currentUser.id
            )

            .maybeSingle();


    if(error){

        console.warn(
            "LANGUAGE PROFILE ERROR:",
            error
        );

        return;

    }


    if(
        data &&
        LANGUAGES[data.langue]
    ){

        currentLanguage =
            data.langue;

    }


    document.getElementById(
        "languageSelect"
    ).value =
        currentLanguage;


    localStorage.setItem(
        "academy_language",
        currentLanguage
    );


    applyInterfaceLanguage();

}


/*
=========================================================
   SAVE STUDENT LANGUAGE
=========================================================
*/

async function saveStudentLanguage(
    language
){

    if(
        !LANGUAGES[language]
    ){

        return;

    }


    currentLanguage =
        language;


    localStorage.setItem(
        "academy_language",
        language
    );


    applyInterfaceLanguage();


    const {
        error
    } =
        await window.supabaseClient

            .from("profils")

            .update({
                langue:language
            })

            .eq(
                "id",
                currentUser.id
            );


    if(error){

        console.warn(
            "LANGUAGE SAVE ERROR:",
            error
        );

    }


    /*
       Recharge les traductions
       de la leçon.
    */

    if(currentLesson){

        await loadTranslations();

        afficherLecon();

        await afficherNavigation();

    }

}


/*
=========================================================
   TRANSLATIONS
=========================================================
*/

let lessonTranslation = null;

let moduleTranslation = null;

let courseTranslation = null;


async function loadTranslations(){

    lessonTranslation = null;

    moduleTranslation = null;

    courseTranslation = null;


    /*
    -----------------------------
       LESSON TRANSLATION
    -----------------------------
    */

    const {
        data:lessonData,
        error:lessonError
    } =
        await window.supabaseClient

            .from("lesson_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(lessonError){

        console.warn(
            "LESSON TRANSLATION ERROR:",
            lessonError
        );

    }else{

        lessonTranslation =
            lessonData;

    }


    /*
    -----------------------------
       MODULE TRANSLATION
    -----------------------------
    */

    const {
        data:moduleData,
        error:moduleError
    } =
        await window.supabaseClient

            .from("module_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "module_id",
                currentModule.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(moduleError){

        console.warn(
            "MODULE TRANSLATION ERROR:",
            moduleError
        );

    }else{

        moduleTranslation =
            moduleData;

    }


    /*
    -----------------------------
       COURSE TRANSLATION
    -----------------------------
    */

    const {
        data:courseData,
        error:courseError
    } =
        await window.supabaseClient

            .from("course_translations")

            .select(`
                title,
                description
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "language_code",
                currentLanguage
            )

            .maybeSingle();


    if(courseError){

        console.warn(
            "COURSE TRANSLATION ERROR:",
            courseError
        );

    }else{

        courseTranslation =
            courseData;

    }

}


/*
=========================================================
   LOAD LESSON
=========================================================
*/

async function chargerLecon(){

    try{

        if(
            !window.supabaseClient
        ){

            throw new Error(
                "Supabase Client introuvable."
            );

        }


        const lessonId =
            getLessonId();


        if(!lessonId){

            throw new Error(
                "Aucun ID de leçon dans l'URL."
            );

        }


        currentUser =
            await getAuthenticatedUser();


        if(!currentUser){

            return;

        }


        /*
        -----------------------------
           LANGUAGE
        -----------------------------
        */

        await loadStudentLanguage();


        /*
        -----------------------------
           LESSON
        -----------------------------
        */

        const {
            data:lesson,
            error:lessonError
        } =
            await window.supabaseClient

                .from("lessons")

                .select(`
                    id,
                    module_id,
                    lesson_number,
                    title,
                    description,
                    video_url,
                    audio_url,
                    estimated_duration,
                    is_published
                `)

                .eq(
                    "id",
                    lessonId
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(lessonError){

            throw lessonError;

        }


        if(!lesson){

            throw new Error(
                getLanguage().lessonNotFound
            );

        }


        currentLesson =
            lesson;


        /*
        -----------------------------
           MODULE
        -----------------------------
        */

        const {
            data:module,
            error:moduleError
        } =
            await window.supabaseClient

                .from("modules")

                .select(`
                    id,
                    course_id,
                    module_number,
                    title,
                    description,
                    is_published
                `)

                .eq(
                    "id",
                    lesson.module_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(moduleError){

            throw moduleError;

        }


        if(!module){

            throw new Error(
                getLanguage().moduleNotFound
            );

        }


        currentModule =
            module;


        /*
        -----------------------------
           COURSE
        -----------------------------
        */

        const {
            data:course,
            error:courseError
        } =
            await window.supabaseClient

                .from("courses")

                .select(`
                    id,
                    title,
                    description,
                    level,
                    is_published
                `)

                .eq(
                    "id",
                    module.course_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(courseError){

            throw courseError;

        }


        if(!course){

            throw new Error(
                getLanguage().courseNotFound
            );

        }


        currentCourse =
            course;


        /*
        -----------------------------
           TRANSLATIONS
        -----------------------------
        */

        await loadTranslations();


        /*
        -----------------------------
           PROGRESS
        -----------------------------
        */

        await chargerProgression();


        await chargerLeconsCours();


        afficherLecon();


        await afficherProgression();


        await afficherNavigation();


        document
            .getElementById("loading")
            .classList.add("hidden");


        document
            .getElementById("lessonPage")
            .classList.remove("hidden");


    }catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        showError(
            "❌ " +
            (
                error.message ||
                error
            )
        );

    }

}


/*
=========================================================
   PROGRESS
=========================================================
*/

async function chargerProgression(){

    const {
        data,
        error
    } =
        await window.supabaseClient

            .from("user_lesson_progress")

            .select(`
                id,
                user_id,
                lesson_id,
                completed,
                completed_at,
                created_at
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .maybeSingle();


    if(error){

        throw error;

    }


    currentProgress =
        data;

}

=========================================================

=========================================================
*/

async function chargerLeconsCours(){

    const {
        data:modules,
        error:moduleError
    } =
        await window.supabaseClient

            .from("modules")

            .select(`
                id,
                course_id,
                module_number,
                is_published
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "module_number",
                {
                    ascending:true
                }
            );


    if(moduleError){

        throw moduleError;

    }


    if(
        !modules ||
        modules.length === 0
    ){

        courseLessons = [];

        return;

    }


    const moduleIds =
        modules.map(
            module => module.id
        );


    const {
        data:lessons,
        error:lessonError
    } =
        await window.supabaseClient

            .from("lessons")

            .select(`
                id,
                module_id,
                lesson_number,
                title,
                is_published
            `)

            .in(
                "module_id",
                moduleIds
            )

            .eq(
                "is_published",
                true
            );


    if(lessonError){

        throw lessonError;

    }


    const moduleOrder = {};


    modules.forEach(
        module => {

            moduleOrder[
                module.id
            ] =
                module.module_number;

        }
    );


    courseLessons =
        lessons || [];


    courseLessons.sort(
        (a,b) => {

            const moduleA =
                moduleOrder[a.module_id] || 0;

            const moduleB =
                moduleOrder[b.module_id] || 0;


            if(
                moduleA !==
                moduleB
            ){

                return moduleA - moduleB;

            }


            return (
                (a.lesson_number || 0)
                -
                (b.lesson_number || 0)
            );

        }
    );


    currentIndex =
        courseLessons.findIndex(
            lesson =>
                lesson.id ===
                currentLesson.id
        );

}


/*
=========================================================
   DISPLAY LESSON
=========================================================
*/

function afficherLecon(){

    const t =
        getLanguage();


    const courseTitle =
        courseTranslation?.title ||
        currentCourse.title;


    const moduleTitle =
        moduleTranslation?.title ||
        currentModule.title;


    const lessonTitle =
        lessonTranslation?.title ||
        currentLesson.title;


    const lessonDescription =
        lessonTranslation?.description ||
        currentLesson.description ||
        t.noDescription;


    document.getElementById(
        "courseName"
    ).textContent =
        courseTitle;


    document.getElementById(
        "moduleName"
    ).textContent =
        moduleTitle;


    document.getElementById(
        "lessonNumber"
    ).textContent =
        (
            currentLanguage === "ht"
            ? "LESON "
            : currentLanguage === "en"
            ? "LESSON "
            : "LEÇON "
        ) +
        (
            currentLesson.lesson_number ||
            ""
        );


    document.getElementById(
        "lessonTitle"
    ).textContent =
        lessonTitle;


    document.getElementById(
        "lessonDescription"
    ).textContent =
        lessonDescription;


    document.getElementById(
        "duration"
    ).textContent =
        currentLesson.estimated_duration

        ? t.duration +
          " " +
          currentLesson.estimated_duration +
          " min"

        : t.noDuration;


    afficherVideo();

    afficherAudio();

    afficherStatut();

}


/*
=========================================================
   VIDEO
=========================================================
*/

function afficherVideo(){

    const container =
        document.getElementById(
            "videoContainer"
        );


    const video =
        document.getElementById(
            "lessonVideo"
        );


    const link =
        document.getElementById(
            "videoLink"
        );


    const t =
        getLanguage();


    if(
        !currentLesson.video_url
    ){

        container.classList.add(
            "hidden"
        );

        return;

    }


    container.classList.remove(
        "hidden"
    );


    const url =
        currentLesson.video_url;


    if(
        /\.(mp4|webm|ogg)(\?.*)?$/i
            .test(url)
    ){

        video.src =
            url;

        video.classList.remove(
            "hidden"
        );

        link.classList.add(
            "hidden"
        );

    }else{

        video.classList.add(
            "hidden"
        );

        link.href =
            url;

        link.textContent =
            t.openVideo;

        link.classList.remove(
            "hidden"
        );

    }

}


/*
=========================================================
   AUDIO
=========================================================
*/

function afficherAudio(){

    const box =
        document.getElementById(
            "audioBox"
        );


    const audio =
        document.getElementById(
            "lessonAudio"
        );


    if(
        !currentLesson.audio_url
    ){

        box.classList.add(
            "hidden"
        );

        return;

    }


    box.classList.remove(
        "hidden"
    );


    audio.src =
        currentLesson.audio_url;

}


/*
=========================================================
   STATUS
=========================================================
*/

function afficherStatut(){

    if(
        !currentLesson
    ){

        return;

    }


    const t =
        getLanguage();


    const button =
        document.getElementById(
            "completeButton"
        );


    const status =
        document.getElementById(
            "statusText"
        );


    const headerStatus =
        document.getElementById(
            "lessonStatus"
        );


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        button.textContent =
            t.completed;

        button.disabled =
            true;


        status.textContent =
            t.completedMessage;


        status.className =
            "status completed";


        headerStatus.textContent =
            t.finished;


        headerStatus.style.background =
            "#dcfce7";


        headerStatus.style.color =
            "#166534";


    }else{

        button.textContent =
            t.complete;


        button.disabled =
            false;


        status.textContent =
            t.notCompleted;


        status.className =
            "status pending";


        headerStatus.textContent =
            t.inProgress;


        headerStatus.style.background =
            "";


        headerStatus.style.color =
            "";

    }

}


/*
=========================================================
   NAVIGATION
=========================================================
*/

async function afficherNavigation(){

    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const quizButton =
        document.getElementById(
            "quizButton"
        );


    nextButton.classList.add(
        "hidden"
    );


    quizButton.classList.add(
        "hidden"
    );


    if(
        currentIndex === -1
    ){

        return;

    }


    if(
        currentIndex <
        courseLessons.length - 1
    ){

        const nextLesson =
            courseLessons[
                currentIndex + 1
            ];


        nextButton.href =
            "lesson.html?id=" +
            encodeURIComponent(
                nextLesson.id
            );


        nextButton.classList.remove(
            "hidden"
        );


        return;

    }


    /*
       DERNIÈRE LEÇON
    */

    const {
        data:progress,
        error
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(
                "lesson_id,completed"
            )

            .eq(
                "user_id",
                currentUser.id
            );


    if(error){

        console.error(
            "PROGRESS CHECK ERROR:",
            error
        );

        return;

    }


    const completedIds =
        new Set(

            (progress || [])

                .filter(
                    row =>
                        row.completed === true
                )

                .map(
                    row =>
                        row.lesson_id
                )

        );


    const allCompleted =
        courseLessons.length > 0 &&

        courseLessons.every(
            lesson =>
                completedIds.has(
                    lesson.id
                )
        );


    if(!allCompleted){

        return;

    }


    /*
       QUIZ FINAL DU COURS
    */

    const {
        data:quiz,
        error:quizError
    } =
        await window.supabaseClient

            .from("quizzes")

            .select("id")

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "is_published",
                true
            )

            .limit(1)

            .maybeSingle();


    if(
        !quizError &&
        quiz
    ){

        quizButton.href =
            "quiz.html?id=" +
            encodeURIComponent(
                quiz.id
            );


        quizButton.classList.remove(
            "hidden"
        );

    }

}


/*
=========================================================
   COMPLETE LESSON
=========================================================
*/

async function terminerLecon(){

    const t =
        getLanguage();


    const button =
        document.getElementById(
            "completeButton"
        );


    const message =
        document.getElementById(
            "actionMessage"
        );


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        t.saving;


    message.className =
        "message";


    message.textContent =
        "";


    try{

        const {
            data:existing,
            error:existingError
        } =
            await window.supabaseClient

                .from(
                    "user_lesson_progress"
                )

                .select("id")

                .eq(
                    "user_id",
                    currentUser.id
                )

                .eq(
                    "lesson_id",
                    currentLesson.id
                )

                .maybeSingle();


        if(existingError){

            throw existingError;

        }


        let saved;


        if(existing){

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .update({

                        completed:true,

                        completed_at:
                            new Date()
                            .toISOString()

                    })

                    .eq(
                        "id",
                        existing.id
                    )

                    .select()

                    .single();


            if(error){

                throw error;

            }


            saved =
                data;


        }else{

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .insert({

                        user_id:
                            currentUser.id,

                        lesson_id:
                            currentLesson.id,

                        completed:true,

                        completed_at:
                            new Date()
                            .toISOString()

                    })

                    .select()

                    .single();


            if(error){

                throw error;

            }


            saved =
                data;

        }


        currentProgress =
            saved;


        afficherStatut();


        message.textContent =
            t.success;


        message.className =
            "message success";


        await afficherProgression();


        await afficherNavigation();


    }catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            t.complete;


        message.textContent =
            t.saveError +
            " " +
            (
                error.message ||
                ""
            );


        message.className =
            "message error";

    }

}


/*
=========================================================
   COURSE PROGRESS
=========================================================
*/

async function afficherProgression(){

    if(
        !currentCourse ||
        courseLessons.length === 0
    ){

        return;

    }


    const lessonIds =
        courseLessons.map(
            lesson =>
                lesson.id
        );


    const {
        data,
        error
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(
                "lesson_id,completed"
            )

            .eq(
                "user_id",
                currentUser.id
            )

            .in(
                "lesson_id",
                lessonIds
            );


    if(error){

        console.error(
            "COURSE PROGRESS ERROR:",
            error
        );

        return;

    }


    const completed =
        (
            data || []
        )
        .filter(
            row =>
                row.completed === true
        )
        .length;


    const total =
        courseLessons.length;


    const percentage =
        total === 0

        ? 0

        : Math.round(
            (
                completed /
                total
            ) * 100
        );


    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).textContent =

        completed +
        " / " +
        total +
        (
            currentLanguage === "ht"
            ? " leson fini — "
            : currentLanguage === "en"
            ? " lessons completed — "
            : " leçons terminées — "
        ) +
        percentage +
        "%";

}
