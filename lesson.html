}

.audio-box{

}

.audio-box audio{

    margin-top:12px;
}

.progress-box{
    margin-top:30px;

    border-radius:18px;
    background:#f8fafc;
}

.status{
    font-weight:bold;
}

.status.completed{
    color:#15803d;
}

.status.pending{
    color:#d97706;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;

button,

    cursor:pointer;

    font-size:15px;

.complete-btn{

}

}

.next-btn{
    background:#287cff;
    color:white;
}

.quiz-btn{
    background:#7c3aed;

}

.dashboard-btn{
    background:#e5e7eb;

.message{

    padding:13px;

}

}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.course-progress{

}

.progress-track{
    width:100%;
    height:10px;
    background:#e5e7eb;

.progress-bar{

    background:#287cff;
    transition:width .3s;
}

.progress-text{

.debug{

    border-radius:10px;
    background:#fff;
    color:#64748b;
    font-size:12px;
    word-break:break-word;
}

    }

    .actions{

    }

    .actions button,

        text-align:center;
    }

</style>

<!-- =====================================================
     SUPABASE SDK
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =====================================================
     CENTRAL SUPABASE CLIENT
===================================================== -->

<script src="supabase.js"></script>



<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentLesson = null;

let currentModule = null;

let currentCourse = null;

let currentProgress = null;

let courseLessons = [];

let currentIndex = -1;


/* =========================================================
   DOM
========================================================= */

function $(id){

    return document.getElementById(id);

}


/* =========================================================
   GET LESSON ID
========================================================= */

function getLessonId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    /*
       Supporte :

       lesson.html?id=UUID

       et également :

       lesson.html?lesson_id=UUID

       Cela rend la page plus robuste.
    */

    const id =
        params.get("id") ||
        params.get("lesson_id");


    if(!id){

        return null;

    }


    return String(id).trim();

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    $("loading")
        .classList
        .add("hidden");


    const box =
        $("errorBox");


    box.innerHTML = `

        <strong>
            ❌ Impossible de charger la leçon
        </strong>

        <br><br>

        ${escapeHTML(message)}

        <div class="debug">

            Vérifiez également la console
            du navigateur.

        </div>

    `;


    box.classList.remove(
        "hidden"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   AUTH
========================================================= */

async function getAuthenticatedUser(){

    if(!window.supabaseClient){

        throw new Error(
            "Supabase Client introuvable. Vérifiez supabase.js."
        );

    }


    /*
       On demande d'abord la session
       au client central.

       Supabase conserve normalement
       cette session dans le storage
       du navigateur.
    */

    const {
        data:sessionData,
        error:sessionError
    } =
        await window.supabaseClient
            .auth
            .getSession();


    if(sessionError){

        throw sessionError;

    }


    if(
        !sessionData ||
        !sessionData.session
    ){

        window.location.href =
            "login.html";

        return null;

    }


    /*
       Ensuite getUser() vérifie
       l'utilisateur auprès de Supabase Auth.
    */

    const {
        data:userData,
        error:userError
    } =
        await window.supabaseClient
            .auth
            .getUser();


    if(userError){

        throw userError;

    }


    if(
        !userData ||
        !userData.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return userData.user;

}


/* =========================================================
   LOAD LESSON
========================================================= */

async function chargerLecon(){

    try{


        /* ---------------------------------------------
           CLIENT
        --------------------------------------------- */

        if(
            !window.supabaseClient
        ){

            throw new Error(
                "Supabase Client introuvable."
            );

        }


        console.log(
            "✅ Supabase Client OK"
        );


        /* ---------------------------------------------
           LESSON ID
        --------------------------------------------- */

        const lessonId =
            getLessonId();


        console.log(
            "🔎 Lesson ID:",
            lessonId
        );


        if(!lessonId){

            throw new Error(
                "Aucun ID de leçon dans l'URL. Ouvrez la leçon depuis « Mes Cours »."
            );

        }


        /* ---------------------------------------------
           AUTH
        --------------------------------------------- */

        currentUser =
            await getAuthenticatedUser();


        if(!currentUser){

            return;

        }


        console.log(
            "👤 User:",
            currentUser.id
        );


        /* ---------------------------------------------
           LESSON
        --------------------------------------------- */

        const {
            data:lesson,
            error:lessonError
        } =
            await window.supabaseClient

                .from("lessons")

                .select(`
                    id,
                    module_id,
                    lesson_number,
                    title,
                    description,
                    video_url,
                    audio_url,
                    estimated_duration,
                    is_published
                `)

                .eq(
                    "id",
                    lessonId
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(lessonError){

            throw lessonError;

        }


        if(!lesson){

            throw new Error(
                "Leçon introuvable ou non publiée."
            );

        }


        currentLesson =
            lesson;


        console.log(
            "📖 Lesson:",
            currentLesson
        );


        /* ---------------------------------------------
           MODULE
        --------------------------------------------- */

        const {
            data:module,
            error:moduleError
        } =
            await window.supabaseClient

                .from("modules")

                .select(`
                    id,
                    course_id,
                    module_number,
                    title,
                    description,
                    is_published
                `)

                .eq(
                    "id",
                    lesson.module_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(moduleError){

            throw moduleError;

        }


        if(!module){

            throw new Error(
                "Module introuvable ou non publié."
            );

        }


        currentModule =
            module;


        /* ---------------------------------------------
           COURSE
        --------------------------------------------- */

        const {
            data:course,
            error:courseError
        } =
            await window.supabaseClient

                .from("courses")

                .select(`
                    id,
                    title,
                    description,
                    level,
                    language,
                    is_published
                `)

                .eq(
                    "id",
                    module.course_id
                )

                .eq(
                    "is_published",
                    true
                )

                .maybeSingle();


        if(courseError){

            throw courseError;

        }


        if(!course){

            throw new Error(
                "Cours introuvable ou non publié."
            );

        }


        currentCourse =
            course;


        /* ---------------------------------------------
           PROGRESSION
        --------------------------------------------- */

        await chargerProgression();


        /* ---------------------------------------------
           LESSONS DU COURS
        --------------------------------------------- */

        await chargerLeconsCours();


        /* ---------------------------------------------
           DISPLAY
        --------------------------------------------- */

        afficherLecon();


        await afficherProgression();


        await afficherNavigation();


        $("loading")
            .classList
            .add("hidden");


        $("lessonPage")
            .classList
            .remove("hidden");


    }

    catch(error){

        console.error(
            "LESSON ERROR:",
            error
        );


        showError(
            error.message ||
            String(error)
        );

    }

}


/* =========================================================
   LOAD CURRENT PROGRESS
========================================================= */

async function chargerProgression(){

    const {
        data,
        error
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(`
                id,
                user_id,
                lesson_id,
                completed,
                completed_at,
                created_at
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .eq(
                "lesson_id",
                currentLesson.id
            )

            .maybeSingle();


    if(error){

        throw error;

    }


    currentProgress =
        data || null;

}


/* =========================================================
   LOAD ALL COURSE LESSONS
========================================================= */

async function chargerLeconsCours(){

    const {
        data:modules,
        error:moduleError
    } =
        await window.supabaseClient

            .from("modules")

            .select(`
                id,
                course_id,
                module_number,
                is_published
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "module_number",
                {
                    ascending:true
                }
            );


    if(moduleError){

        throw moduleError;

    }


    const moduleList =
        modules || [];


    if(
        moduleList.length === 0
    ){

        courseLessons = [];

        return;

    }


    const moduleIds =
        moduleList.map(
            module =>
                module.id
        );


    const {
        data:lessons,
        error:lessonError
    } =
        await window.supabaseClient

            .from("lessons")

            .select(`
                id,
                module_id,
                lesson_number,
                title,
                is_published
            `)

            .in(
                "module_id",
                moduleIds
            )

            .eq(
                "is_published",
                true
            );


    if(lessonError){

        throw lessonError;

    }


    courseLessons =
        lessons || [];


    const moduleOrder = {};


    moduleList.forEach(
        module => {

            moduleOrder[
                module.id
            ] =
                Number(
                    module.module_number
                ) || 0;

        }
    );


    courseLessons.sort(
        (
            a,
            b
        ) => {

            const moduleA =
                moduleOrder[
                    a.module_id
                ] || 0;


            const moduleB =
                moduleOrder[
                    b.module_id
                ] || 0;


            if(
                moduleA !== moduleB
            ){

                return (
                    moduleA -
                    moduleB
                );

            }


            return (
                (
                    Number(
                        a.lesson_number
                    ) || 0
                )
                -
                (
                    Number(
                        b.lesson_number
                    ) || 0
                )
            );

        }
    );


    currentIndex =
        courseLessons.findIndex(
            lesson =>
                lesson.id ===
                currentLesson.id
        );


    console.log(
        "📚 Course lessons:",
        courseLessons
    );


    console.log(
        "📍 Current index:",
        currentIndex
    );

}


/* =========================================================
   DISPLAY LESSON
========================================================= */

function afficherLecon(){

    $("courseName")
        .textContent =
        currentCourse.title;


    $("moduleName")
        .textContent =
        currentModule.title;


    $("lessonNumber")
        .textContent =
        "LEÇON " +
        (
            currentLesson.lesson_number ||
            ""
        );


    $("lessonTitle")
        .textContent =
        currentLesson.title;


    $("lessonDescription")
        .textContent =
        currentLesson.description ||
        "Aucun contenu détaillé disponible pour cette leçon.";


    $("duration")
        .textContent =
        currentLesson.estimated_duration
        ? "⏱ " +
          currentLesson.estimated_duration +
          " min"

        : "⏱ Durée non définie";


    afficherVideo();

    afficherAudio();

    afficherStatut();

}


/* =========================================================
   VIDEO
========================================================= */

function afficherVideo(){

    const container =
        $("videoContainer");

    const video =
        $("lessonVideo");

    const link =
        $("videoLink");


    if(
        !currentLesson.video_url
    ){

        container
            .classList
            .add("hidden");

        return;

    }


    const url =
        String(
            currentLesson.video_url
        ).trim();


    container
        .classList
        .remove("hidden");


    /*
       Direct video files
    */

    if(
        /\.(mp4|webm|ogg)(\?.*)?$/i
            .test(url)
    ){

        video.src =
            url;

        video.classList
            .remove("hidden");


        link.classList
            .add("hidden");

    }

    else{

        /*
           YouTube,
           Vimeo,
           autres URLs
        */

        video.classList
            .add("hidden");


        link.href =
            url;


        link.classList
            .remove("hidden");

    }

}


/* =========================================================
   AUDIO
========================================================= */

function afficherAudio(){

    const box =
        $("audioBox");

    const audio =
        $("lessonAudio");


    if(
        !currentLesson.audio_url
    ){

        box.classList
            .add("hidden");

        return;

    }


    box.classList
        .remove("hidden");


    audio.src =
        currentLesson.audio_url;

}


/* =========================================================
   STATUS
========================================================= */

function afficherStatut(){

    const button =
        $("completeButton");

    const status =
        $("statusText");

    const headerStatus =
        $("lessonStatus");


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        button.textContent =
            "✓ Leçon terminée";


        button.disabled =
            true;


        status.textContent =
            "✓ Cette leçon est terminée.";


        status.className =
            "status completed";


        headerStatus.textContent =
            "✓ Terminée";


        headerStatus.style.background =
            "#dcfce7";


        headerStatus.style.color =
            "#166534";

    }

    else{

        button.textContent =
            "✓ Marquer comme terminée";


        button.disabled =
            false;


        status.textContent =
            "⏳ Cette leçon n'est pas encore terminée.";


        status.className =
            "status pending";


        headerStatus.textContent =
            "⏳ En cours";


        headerStatus.style.background =
            "";


        headerStatus.style.color =
            "";

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

async function afficherNavigation(){

    const nextButton =
        $("nextButton");

    const quizButton =
        $("quizButton");


    nextButton
        .classList
        .add("hidden");


    quizButton
        .classList
        .add("hidden");


    if(
        currentIndex === -1
    ){

        return;

    }


    /*
       NEXT LESSON
    */

    if(
        currentIndex <
        courseLessons.length - 1
    ){

        const nextLesson =
            courseLessons[
                currentIndex + 1
            ];


        nextButton.href =
            "lesson.html?id=" +
            encodeURIComponent(
                nextLesson.id
            );


        nextButton
            .classList
            .remove("hidden");


        return;

    }


    /*
       LAST LESSON
    */

    if(
        courseLessons.length === 0
    ){

        return;

    }


    /*
       Check completed lessons
    */

    const lessonIds =
        courseLessons.map(
            lesson =>
                lesson.id
        );


    const {
        data:progress,
        error:progressError
    } =
        await window.supabaseClient

            .from(
                "user_lesson_progress"
            )

            .select(`
                lesson_id,
                completed
            `)

            .eq(
                "user_id",
                currentUser.id
            )

            .in(
                "lesson_id",
                lessonIds
            );


    if(progressError){

        console.error(
            "PROGRESS CHECK ERROR:",
            progressError
        );

        return;

    }


    const completedIds =
        new Set(
            (
                progress || []
            )
            .filter(
                row =>
                    row.completed === true
            )
            .map(
                row =>
                    row.lesson_id
            )
        );


    const allCompleted =
        courseLessons.every(
            lesson =>
                completedIds.has(
                    lesson.id
                )
        );


    /*
       Only unlock quiz when
       every lesson is completed.
    */

    if(!allCompleted){

        return;

    }


    /*
       Find quiz belonging to course
    */

    const {
        data:quiz,
        error:quizError
    } =
        await window.supabaseClient

            .from("quizzes")

            .select(`
                id,
                course_id
            `)

            .eq(
                "course_id",
                currentCourse.id
            )

            .limit(1)
            .maybeSingle();


    if(quizError){

        console.error(
            "QUIZ SEARCH ERROR:",
            quizError
        );

        return;

    }


    if(!quiz){

        console.warn(
            "Aucun quiz trouvé pour ce cours."
        );

        return;

    }


    quizButton.href =
        "quiz.html?id=" +
        encodeURIComponent(
            quiz.id
        );


    quizButton
        .classList
        .remove("hidden");

}


/* =========================================================
   COMPLETE LESSON
========================================================= */

async function terminerLecon(){

    const button =
        $("completeButton");

    const message =
        $("actionMessage");


    if(
        currentProgress &&
        currentProgress.completed === true
    ){

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "⏳ Enregistrement...";


    message.className =
        "message";


    message.textContent =
        "";


    try{


        /*
           Check existing row
        */

        const {
            data:existing,
            error:existingError
        } =
            await window.supabaseClient

                .from(
                    "user_lesson_progress"
                )

                .select("id")

                .eq(
                    "user_id",
                    currentUser.id
                )

                .eq(
                    "lesson_id",
                    currentLesson.id
                )

                .maybeSingle();


        if(existingError){

            throw existingError;

        }


        let saved;


        /*
           UPDATE
        */

        if(existing){

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .update({

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    })

                    .eq(
                        "id",
                        existing.id
                    )

                    .select()
                    .single();


            if(error){

                throw error;

            }


            saved =
                data;

        }


        /*
           INSERT
        */

        else{

            const {
                data,
                error
            } =
                await window.supabaseClient

                    .from(
                        "user_lesson_progress"
                    )

                    .insert({

                        user_id:
                            currentUser.id,

                        lesson_id:
                            currentLesson.id,

                        completed:true,

                        completed_at:
                            new Date()
                                .toISOString()

                    })

                    .select()
                    .single();


            if(error){

                throw error;

            }


            saved =
                data;

        }


        currentProgress =
            saved;


        afficherStatut();


        message.textContent =
            "✅ Leçon terminée avec succès.";


        message.className =
            "message success";


        await afficherProgression();


        await afficherNavigation();


    }

    catch(error){

        console.error(
            "COMPLETE LESSON ERROR:",
            error
        );


        button.disabled =
            false;


        button.textContent =
            "✓ Marquer comme terminée";


        message.textContent =
            "❌ Impossible d'enregistrer : " +
            (
                error.message ||
                error
            );


        message.className =
            "message error";

    }

}


/* =========================================================
   COURSE PROGRESS
========================================================= */

async function afficherProgression(){

    try{


        if(
            !currentCourse ||
            courseLessons.length === 0
        ){

            return;

        }


        const lessonIds =
            courseLessons.map(
                lesson =>
                    lesson.id
            );


        const {
            data,
            error
        } =
            await window.supabaseClient

                .from(
                    "user_lesson_progress"
                )

                .select(`
                    lesson_id,
                    completed
                `)

                .eq(
                    "user_id",
                    currentUser.id
                )

                .in(
                    "lesson_id",
                    lessonIds
                );


        if(error){

            throw error;

        }


        const completed =
            (
                data || []
            )
            .filter(
                row =>
                    row.completed === true
            )
            .length;


        const total =
            courseLessons.length;


        const percentage =
            total === 0

            ? 0

            : Math.round(
                (
                    completed /
                    total
                ) * 100
            );


        $("progressBar")
            .style
            .width =
            percentage + "%";


        $("progressText")
            .textContent =
            completed +
            " / " +
            total +
            " leçons terminées — " +
            percentage +
            "%";


    }

    catch(error){

        console.error(
            "COURSE PROGRESS ERROR:",
            error
        );

    }

}

$("completeButton")

        );
