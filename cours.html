/* =========================================================
   HELPERS
========================================================= */

function t(key){

    return (
        LANGUAGE_CONFIG[currentLanguage]?.[key]
        ||
        LANGUAGE_CONFIG.fr[key]
        ||
        key
    );

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function normalizeLanguage(language){

    const value =
        String(language || "")
            .trim()
            .toLowerCase();


    if(
        value === "ht" ||
        value === "creole" ||
        value === "kreyol" ||
        value === "kreyòl" ||
        value === "haitian"
    ){

        return "ht";

    }


    if(
        value === "en" ||
        value === "english" ||
        value === "anglais"
    ){

        return "en";

    }


    return "fr";

}


function normalizeLevel(level){

    const value =
        String(level || "")
            .trim()
            .toLowerCase();


    if(
        value === "expert"
    ){

        return currentLanguage === "ht"
            ? "Ekspè"
            : currentLanguage === "en"
                ? "Expert"
                : "Expert";

    }


    if(
        value === "intermediate" ||
        value === "intermédiaire" ||
        value === "intermediaire"
    ){

        return currentLanguage === "ht"
            ? "Entèmedyè"
            : currentLanguage === "en"
                ? "Intermediate"
                : "Intermédiaire";

    }


    return currentLanguage === "ht"
        ? "Debitan"
        : currentLanguage === "en"
            ? "Beginner"
            : "Débutant";

}


/* =========================================================
   LOAD USER
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } = await courseClient.auth.getUser();


    if(error){

        throw error;

    }


    if(
        !data ||
        !data.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}


/* =========================================================
   LOAD STUDENT LANGUAGE
========================================================= */

async function loadStudentLanguage(userId){

    const {
        data,
        error
    } =
    await courseClient

        .from("profils")

        .select(`
            langue
        `)

        .eq(
            "id",
            userId
        )

        .maybeSingle();


    if(error){

        throw new Error(
            "Impossible de charger la langue de l'étudiant : " +
            error.message
        );

    }


    /*
     * Si aucune langue n'est définie,
     * on utilise Français comme langue
     * par défaut.
     */

    currentLanguage =
        normalizeLanguage(
            data?.langue || "fr"
        );


    applyLanguageToPage();

}


/* =========================================================
   APPLY LANGUAGE TO STATIC PAGE
========================================================= */

function applyLanguageToPage(){

    const config =
        LANGUAGE_CONFIG[currentLanguage];


    document.documentElement.lang =
        currentLanguage;


    document.getElementById(
        "pageTitle"
    ).textContent =
        t("pageTitle");


    document.getElementById(
        "pageDescription"
    ).textContent =
        t("pageDescription");


    document.getElementById(
        "languageBadge"
    ).textContent =
        config.flag +
        " " +
        config.name;

}

/* =========================================================

========================================================= */

async function getCourseTranslationWithFallback(
    courseId,
    original
){

    const translated =
        await getCourseTranslation(
            courseId
        );


    if(translated){

        return {

            title:
                translated.title ||
                original.title,

            description:
                translated.description ||
                original.description

        };

    }


    return {

}

/* =========================================================
   LOAD COURSES
========================================================= */

async function loadCourses(){

    const content =
        document.getElementById("content");


    try{

        const user =
            await getCurrentUser();


        if(!user){

            return;

        }


        /* -----------------------------------------
           STUDENT LANGUAGE
        ----------------------------------------- */

        await loadStudentLanguage(
            user.id
        );


        /* -----------------------------------------
           COURSES
        ----------------------------------------- */

        const {
            data:courses,
            error:courseError
        } =
        await courseClient

            .from("courses")

            .select(`
                id,
                title,
                description,
                level,
                language,
                is_published,
                created_at
            `)

            .eq(
                "is_published",
                true
            )

            .order(
                "created_at",
                {
                    ascending:true
                }
            );


        if(courseError){

            throw courseError;

        }


        if(
            !courses ||
            courses.length === 0
        ){

            content.innerHTML=`

                <div class="empty">

                    ${t("noCourses")}

                </div>

            `;

            return;

        }


        content.innerHTML="";


        for(
            const course
            of courses
        ){

            await renderCourse(
                course,
                user.id,
                content
            );

        }

    }
    catch(error){

        console.error(
            "COURSES ERROR:",
            error
        );


        content.innerHTML=`

            <div class="error">

                ${t("error")}

                <br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* =========================================================
   RENDER COURSE
========================================================= */

async function renderCourse(
    course,
    userId,
    container
){

    /* -----------------------------------------
       COURSE TRANSLATION
    ----------------------------------------- */

    const courseTranslation =
        await getCourseTranslationWithFallback(
            course.id,
            course
        );


    /* -----------------------------------------
       MODULES
    ----------------------------------------- */

    const {
        data:modules,
        error:moduleError
    } =
    await courseClient

        .from("modules")

        .select(`
            id,
            module_number,
            title,
            description,
            is_published
        `)

        .eq(
            "course_id",
            course.id
        )

        .eq(
            "is_published",
            true
        )

        .order(
            "module_number"
        );


    if(moduleError){

        throw moduleError;

    }


    let allLessons=[];

    let modulesHTML="";


    /* -----------------------------------------
       MODULES + LESSONS
    ----------------------------------------- */

    for(
        const module
        of (modules || [])
    ){

        const moduleTranslation =
            await getModuleTranslationWithFallback(
                module.id,
                module
            );


        const {
            data:lessons,
            error:lessonError
        } =
        await courseClient

            .from("lessons")

            .select(`
                id,
                lesson_number,
                title,
                description,
                is_published
            `)

            .eq(
                "module_id",
                module.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "lesson_number"
            );


        if(lessonError){

            throw lessonError;

        }


        const lessonIds =
            (lessons || []).map(
                lesson =>
                    lesson.id
            );


        let progressMap={};


        /* -----------------------------------------
           USER LESSON PROGRESS
        ----------------------------------------- */

        if(
            lessonIds.length
        ){

            const {
                data:progress,
                error:progressError
            } =
            await courseClient

                .from(
                    "user_lesson_progress"
                )

                .select(`
                    lesson_id,
                    completed,
                    completed_at
                `)

                .eq(
                    "user_id",
                    userId
                )

                .in(
                    "lesson_id",
                    lessonIds
                );


            if(progressError){

                throw progressError;

            }


            (progress || []).forEach(
                row => {

                    progressMap[
                        row.lesson_id
                    ] = row;

                }
            );

        }


        const translatedLessons=[];


        for(
            const lesson
            of (lessons || [])
        ){

            const translation =
                await getLessonTranslationWithFallback(
                    lesson.id,
                    lesson
                );


            const completed =
                progressMap[
                    lesson.id
                ]?.completed === true;


            const translatedLesson = {

                ...lesson,

                title:
                    translation.title,

                description:
                    translation.description,

                completed:
                    completed

            };


            translatedLessons.push(
                translatedLesson
            );


            allLessons.push(
                translatedLesson
            );

        }


        /* -----------------------------------------
           LESSONS HTML
        ----------------------------------------- */

        let lessonsHTML="";


        translatedLessons.forEach(
            lesson => {

                lessonsHTML += `

                    <div class="lesson ${
                        lesson.completed
                        ? "completed"
                        : ""
                    }">

                        <div class="lesson-left">

                            <div class="lesson-icon">

                                ${
                                    lesson.completed
                                    ? "✓"
                                    : "📝"
                                }

                            </div>

                            <div>

                                <div class="lesson-title">

                                    ${escapeHTML(
                                        lesson.title
                                    )}

                                </div>

                                <div class="lesson-status">

                                    ${
                                        lesson.completed
                                        ? t(
                                            "completedLesson"
                                        )
                                        : t(
                                            "unfinishedLesson"
                                        )
                                    }

                                </div>

                            </div>

                        </div>


                        <button
                            class="lesson-btn"
                            onclick="openLesson(
                                '${lesson.id}'
                            )">

                            ${
                                lesson.completed
                                ? t("review")
                                : t("start")
                            }

                        </button>

                    </div>

                `;

            }
        );


        if(
            translatedLessons.length === 0
        ){

            lessonsHTML = `

                <div class="empty">

                    ${t("noLessons")}

                </div>

            `;

        }


        modulesHTML += `

            <div class="module">

                <div class="module-title">

                    <h3>

                        <span class="module-number">

                            MODULE
                            ${escapeHTML(
                                module.module_number
                            )}

                        </span>

                        —
                        ${escapeHTML(
                            moduleTranslation.title
                        )}

                    </h3>

                </div>

                ${lessonsHTML}

            </div>

        `;

    }


    /* -----------------------------------------
       COURSE PROGRESS
    ----------------------------------------- */

    const totalLessons =
        allLessons.length;


    const completedLessons =
        allLessons.filter(
            lesson =>
                lesson.completed
        ).length;


    const progressPercent =
        totalLessons === 0

        ? 0

        : Math.round(
            (
                completedLessons /
                totalLessons
            ) * 100
        );


    const courseCompleted =
        totalLessons > 0 &&
        completedLessons === totalLessons;


    const courseCard =
        document.createElement(
            "section"
        );


    courseCard.className =
        "course-card";


    courseCard.innerHTML = `

        <div class="course-header">

            <h2>
                ${escapeHTML(
                    courseTranslation.title
                )}
            </h2>

            ${
                courseTranslation.description
                ? `
                    <div
                        style="
                            color:#475569;
                            font-size:13px;
                            line-height:1.5;
                            margin-bottom:10px;
                        ">

                        ${escapeHTML(
                            courseTranslation.description
                        )}

                    </div>
                  `
                : ""
            }


            <div class="course-meta">

                ${t("courseLevel")}:
                ${escapeHTML(
                    normalizeLevel(
                        course.level
                    )
                )}

                ·

                ${t("language")}:
                ${escapeHTML(
                    LANGUAGE_CONFIG[
                        currentLanguage
                    ].name
                )}

            </div>


            <div class="progress-box">

                <div class="progress-info">

                    <span>
                        ${t("progression")}
                    </span>

                    <strong>

                        ${completedLessons}
                        /
                        ${totalLessons}

                        (${progressPercent}%)

                    </strong>

                </div>


                <div class="progress">

                    <div
                        class="progress-bar ${
                            courseCompleted
                            ? "completed-bar"
                            : ""
                        }"
                        style="
                            width:${progressPercent}%
                        ">
                    </div>

                </div>

            </div>

        </div>


        ${
            modulesHTML

            ||

            `
                <div class="empty">
                    ${t("noModules")}
                </div>
            `
        }


        <div class="quiz-box">

            <h3>
                ${t("quizTitle")}
            </h3>


            ${
                courseCompleted

                ? `

                    <p class="completed-message">

                        ${t("quizUnlocked")}

                    </p>


                    <button
                        class="quiz-btn quiz-open"
                        onclick="openQuiz(
                            '${course.id}'
                        )">

                        ${t("startQuiz")}

                    </button>

                  `

                : `

                    <p>

                        ${t("quizLocked")}

                        <br>

                        ${t("quizRequirement")}

                    </p>


                    <button
                        class="quiz-btn quiz-locked"
                        disabled>

                        ${t("lockedButton")}

                    </button>

                  `
            }

        </div>

    `;


    container.appendChild(
        courseCard
    );

}


/* =========================================================
   LESSON
========================================================= */

function openLesson(
    lessonId
){

    window.location.href =
        "lesson.html?id=" +
        encodeURIComponent(
            lessonId
        );

}


/* =========================================================
   QUIZ
========================================================= */

function openQuiz(
    courseId
){

    window.location.href =
        "quiz.html?course_id=" +
        encodeURIComponent(
            courseId
        );

}


/* =========================================================
   START
========================================================= */

loadCourses();

</script>

</body>
</html>
