<style>

*{

}

/* ================================
   HEADER
================================ */

    background:#0f172a;

}

}

.logo span{
    color:#3b82f6;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.back-btn,
.language-btn{
    border:0;
    background:#1e293b;
    color:white;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
}

.language-btn{
    font-weight:bold;
}

.language-btn:hover,
.back-btn:hover{
    background:#2563eb;
}


/* ================================
   LANGUAGE MENU
================================ */

.language-menu{
    position:absolute;
    right:20px;
    top:70px;
    background:white;
    color:#172033;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    overflow:hidden;
    display:none;
    min-width:160px;
}

.language-menu button{
    width:100%;
    border:0;
    background:white;
    padding:12px 15px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
}

.language-menu button:hover{
    background:#eff6ff;
}

.language-menu button.active{
    background:#dbeafe;
    color:#1d4ed8;
    font-weight:bold;
}


/* ================================
   CONTAINER
================================ */

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 18px;
}

.page-title{
    margin-bottom:20px;
}

.page-title h1{

    font-size:28px;

.page-title p{

================================ */

.error,

================================ */

/* ================================

================================ */

}

.progress-info{

    font-size:13px;
    margin-bottom:7px;

.progress{

.progress-bar{

    border-radius:20px;

.completed-bar{

================================ */

.module-number{

    font-size:12px;

================================ */

    gap:12px;
    padding:13px;
    margin-bottom:8px;
    background:#f8fafc;
    border-radius:9px;

.lesson:last-child{

}

    border-radius:8px;

    background:#e0ecff;

/* =========================================================
   LANGUAGE HELPERS
========================================================= */

function t(key){

    return (
        translations[currentLanguage]?.[key]
        ||
        translations.fr[key]
        ||
        key
    );

}


function changeLanguage(language){

    if(
        !translations[language]
    ){

        return;

    }


    currentLanguage =
        language;


    localStorage.setItem(
        "academy_language",
        language
    );


    updateStaticTranslations();


    updateLanguageButton();


    closeLanguageMenu();


    /*
       Recharge les cours afin que
       titres/descriptions des lessons
       prennent immédiatement la langue.
    */

    loadCourses();

}


function updateStaticTranslations(){

    document
        .querySelectorAll("[data-i18n]")
        .forEach(
            element => {

                const key =
                    element.dataset.i18n;

                element.textContent =
                    t(key);

            }
        );

}

            !menu.contains(event.target) &&
            !button.contains(event.target)
        ){

            menu.style.display =
                "none";

        }

);


/* =========================================================
   TRANSLATION DATA
=========================================================

   Le système accepte plusieurs formats.

   FORMAT 1 — JSONB:

   translations: {
       "ht": {
           "title": "...",
           "description": "..."
       },
       "fr": {
           "title": "...",
           "description": "..."
       },
       "en": {
           "title": "...",
           "description": "..."
       }
   }

   FORMAT 2 — COLONNES:

   title_ht
   title_fr
   title_en

   description_ht
   description_fr
   description_en

========================================================= */


function getTranslation(
    row,
    field,
    language
){

    if(!row){

        return "";

    }


    /*
       1. JSON translations
    */

    if(
        row.translations &&
        typeof row.translations === "object"
    ){

        const translation =
            row.translations[language];


        if(
            translation &&
            typeof translation === "object" &&
            translation[field]
        ){

            return translation[field];

        }

    }


    /*
       2. Direct columns
    */

    const possibleColumns = [

        field + "_" + language,

        field + "_" +
            (
                language === "ht"
                ? "kreyol"
                : language
            ),

        field + "_" +
            (
                language === "ht"
                ? "creole"
                : language
            )

    ];


    for(
        const column
        of possibleColumns
    ){

        if(
            row[column] !== undefined &&
            row[column] !== null &&
            String(row[column]).trim() !== ""
        ){

            return row[column];

        }

    }


    /*
       3. Fallback
    */

    return row[field] || "";

}


function getTitle(row){

    return getTranslation(
        row,
        "title",
        currentLanguage
    );

}


function getDescription(row){

    return getTranslation(
        row,
        "description",
        currentLanguage
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   LOAD USER
========================================================= */

async function getCurrentUser(){

    const {
        data,
        error
    } =
    await courseClient
        .auth
        .getUser();


    if(
        error ||
        !data.user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    return data.user;

}


/* =========================================================
   LOAD COURSES
========================================================= */

async function loadCourses(){

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = `

        <div class="loading">

            ${escapeHTML(
                t("loading")
            )}

        </div>

    `;


    try{

        const user =
            await getCurrentUser();


        if(!user){

            return;

        }


        /*
           IMPORTANT:
           On récupère toutes les colonnes.

           Cela permet au système de lire
           les traductions JSON ou les colonnes
           title_ht/title_fr/title_en sans
           casser la requête.
        */

        const {
            data:courses,
            error:courseError
        } =
        await courseClient

            .from("courses")

            .select("*")

            .eq(
                "is_published",
                true
            )

            .order(
                "created_at",
                {
                    ascending:true
                }
            );


        if(courseError){

            throw courseError;

        }


        if(
            !courses ||
            courses.length === 0
        ){

            content.innerHTML = `

                <div class="empty">

                    📚
                    ${escapeHTML(
                        t("noCourses")
                    )}

                </div>

            `;

            return;

        }


        content.innerHTML = "";


        for(
            const course
            of courses
        ){

            await renderCourse(
                course,
                user.id,
                content
            );

        }

    }

    catch(error){

        console.error(
            "COURSES ERROR:",
            error
        );


        content.innerHTML = `

            <div class="error">

                ❌
                ${escapeHTML(
                    t("impossible")
                )}

                <br><br>

                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* =========================================================
   RENDER COURSE
========================================================= */

async function renderCourse(
    course,
    userId,
    container
){

    /*
       MODULES
    */

    const {
        data:modules,
        error:moduleError
    } =
    await courseClient

        .from("modules")

        .select("*")

        .eq(
            "course_id",
            course.id
        )

        .eq(
            "is_published",
            true
        )

        .order(
            "module_number"
        );


    if(moduleError){

        throw moduleError;

    }


    let allLessons = [];

    let modulesHTML = "";


    /*
       MODULES + LESSONS
    */

    for(
        const module
        of (modules || [])
    ){

        const {
            data:lessons,
            error:lessonError
        } =
        await courseClient

            .from("lessons")

            .select("*")

            .eq(
                "module_id",
                module.id
            )

            .eq(
                "is_published",
                true
            )

            .order(
                "lesson_number"
            );


        if(lessonError){

            throw lessonError;

        }


        const lessonIds =
            (lessons || []).map(
                lesson =>
                    lesson.id
            );


        let progressMap = {};


        /*
           USER LESSON PROGRESS
        */

        if(
            lessonIds.length
        ){

            const {
                data:progress,
                error:progressError
            } =
            await courseClient

                .from(
                    "user_lesson_progress"
                )

                .select(`
                    lesson_id,
                    completed,
                    completed_at
                `)

                .eq(
                    "user_id",
                    userId
                )

                .in(
                    "lesson_id",
                    lessonIds
                );


            if(progressError){

                throw progressError;

            }


            (
                progress || []
            ).forEach(
                row => {

                    progressMap[
                        row.lesson_id
                    ] = row;

                }
            );

        }


        /*
           SAVE PROGRESS
        */

        (
            lessons || []
        ).forEach(
            lesson => {

                const completed =
                    progressMap[
                        lesson.id
                    ]?.completed === true;


                allLessons.push({

                    ...lesson,

                    completed

                });

            }
        );


        let lessonsHTML = "";


        /*
           LESSON DISPLAY
        */

        (
            lessons || []
        ).forEach(
            lesson => {

                const completed =
                    progressMap[
                        lesson.id
                    ]?.completed === true;


                const title =
                    getTitle(
                        lesson
                    );


                const description =
                    getDescription(
                        lesson
                    );


                lessonsHTML += `

                    <div class="lesson ${
                        completed
                        ? "completed"
                        : ""
                    }">


                        <div class="lesson-left">


                            <div class="lesson-icon">

                                ${
                                    completed
                                    ? "✓"
                                    : "📝"
                                }

                            </div>


                            <div>


                                <div class="lesson-title">

                                    ${escapeHTML(
                                        title
                                    )}

                                </div>


                                ${
                                    description
                                    ? `

                                        <div class="lesson-description">

                                            ${escapeHTML(
                                                description
                                            )}

                                        </div>

                                    `
                                    : ""
                                }


                                <div class="lesson-status">

                                    ${
                                        completed
                                        ? escapeHTML(
                                            t(
                                                "lessonFinished"
                                            )
                                        )
                                        : escapeHTML(
                                            t(
                                                "lessonToDo"
                                            )
                                        )
                                    }

                                </div>


                            </div>


                        </div>


                        <button
                            class="lesson-btn"
                            onclick="openLesson(
                                '${lesson.id}'
                            )">


                            ${
                                completed
                                ? escapeHTML(
                                    t("review")
                                )
                                : escapeHTML(
                                    t("start")
                                )
                            }


                        </button>


                    </div>

                `;

            }
        );


        /*
           MODULE TITLE
        */

        const moduleTitle =
            getTitle(
                module
            );


        const moduleDescription =
            getDescription(
                module
            );


        modulesHTML += `

            <div class="module">


                <div class="module-title">


                    <h3>

                        <span class="module-number">

                            ${escapeHTML(
                                t("module")
                            )}

                            ${escapeHTML(
                                module.module_number
                            )}

                        </span>

                        —

                        ${escapeHTML(
                            moduleTitle
                        )}

                    </h3>


                    ${
                        moduleDescription
                        ? `

                            <div class="module-description">

                                ${escapeHTML(
                                    moduleDescription
                                )}

                            </div>

                        `
                        : ""
                    }


                </div>


                ${

                    lessonsHTML

                    ||

                    `

                        <div class="empty">

                            ${escapeHTML(
                                t("noModules")
                            )}

                        </div>

                    `

                }


            </div>

        `;

    }


    /*
       COURSE PROGRESS
    */

    const totalLessons =
        allLessons.length;


    const completedLessons =
        allLessons.filter(
            lesson =>
                lesson.completed
        ).length;


    const progressPercent =
        totalLessons === 0

        ? 0

        : Math.round(
            (
                completedLessons /
                totalLessons
            ) * 100
        );


    const courseCompleted =
        totalLessons > 0 &&
        completedLessons ===
            totalLessons;


    /*
       COURSE TITLE
    */

    const courseTitle =
        getTitle(
            course
        );


    const courseDescription =
        getDescription(
            course
        );


    const courseCard =
        document.createElement(
            "section"
        );


    courseCard.className =
        "course-card";


    courseCard.innerHTML = `

        <div class="course-header">


            <h2>

                ${escapeHTML(
                    courseTitle
                )}

            </h2>


            ${
                courseDescription

                ? `

                    <div class="course-description">

                        ${escapeHTML(
                            courseDescription
                        )}

                    </div>

                `

                : ""

            }


            <div class="course-meta">

                ${escapeHTML(
                    t("level")
                )}

                :

                ${escapeHTML(
                    course.level || "-"
                )}

                ·

                ${escapeHTML(
                    t("language")
                )}

                :

                ${escapeHTML(
                    course.language || "-"
                )}


                <div class="language-info">

                    🌐

                    ${escapeHTML(
                        t("languageLabel")
                    )}

                    :

                    ${
                        currentLanguage === "ht"
                        ? "Kreyòl"
                        : currentLanguage === "fr"
                        ? "Français"
                        : "English"
                    }

                </div>


            </div>


            <div class="progress-box">


                <div class="progress-info">


                    <span>

                        ${escapeHTML(
                            t("progress")
                        )}

                    </span>


                    <strong>

                        ${completedLessons}

                        /

                        ${totalLessons}

                        (${progressPercent}%)

                    </strong>


                </div>


                <div class="progress">


                    <div
                        class="progress-bar ${
                            courseCompleted
                            ? "completed-bar"
                            : ""
                        }"
                        style="
                            width:${progressPercent}%
                        "
                    >
                    </div>


                </div>


            </div>


        </div>


        ${

            modulesHTML

            ||

            `

                <div class="empty">

                    ${escapeHTML(
                        t("noModules")
                    )}

                </div>

            `

        }


        <div class="quiz-box">


            <h3>

                🧠

                ${escapeHTML(
                    t("quiz")
                )}

            </h3>


            ${

                courseCompleted

                ?

                `

                    <p class="completed-message">

                        ✓

                        ${escapeHTML(
                            t("quizUnlocked")
                        )}

                    </p>


                    <button
                        class="quiz-btn quiz-open"
                        onclick="openQuiz(
                            '${course.id}'
                        )">

                        🎯

                        ${escapeHTML(
                            t("startQuiz")
                        )}

                    </button>

                `

                :

                `

                    <p>

                        🔒

                        ${escapeHTML(
                            t("quizLocked")
                        )}

                        <br><br>

                        ${escapeHTML(
                            t("quizRequirement")
                        )}

                    </p>


                    <button
                        class="quiz-btn quiz-locked"
                        disabled>

                        🔒

                        ${escapeHTML(
                            t("quizLocked")
                        )}

                    </button>

                `

            }


        </div>

    `;


    container.appendChild(
        courseCard
    );

}


/* =========================================================
   LESSON
========================================================= */

function openLesson(
    lessonId
){

    window.location.href =
        "lesson.html?id=" +
        encodeURIComponent(
            lessonId
        );

}


/* =========================================================
   FINAL COURSE QUIZ
========================================================= */

async function openQuiz(
    courseId
){

    console.log(
        "🎯 Recherche du quiz final..."
    );

    console.log(
        "Course ID:",
        courseId
    );


    try{


        if(!courseId){

            throw new Error(
                "ID du cours manquant."
            );

        }


        const {
            data:quiz,
            error
        } =
        await courseClient

            .from("quizzes")

            .select(`
                id,
                course_id,
                lesson_id,
                title,
                is_published
            `)

            .eq(
                "course_id",
                courseId
            )

            .is(
                "lesson_id",
                null
            )

            .eq(
                "is_published",
                true
            )

            .limit(1)

            .maybeSingle();


        if(error){

            console.error(
                "QUIZ SEARCH ERROR:",
                error
            );

            throw error;

        }


        if(!quiz){

            alert(
                t("quizNotFound")
            );

            return;

        }


        console.log(
            "Quiz trouvé:",
            quiz
        );


        window.location.href =
            "quiz.html?quiz_id=" +
            encodeURIComponent(
                quiz.id
            );

    }


    catch(error){

        console.error(
            "OPEN QUIZ ERROR:",
            error
        );


        alert(
            t("quizError") +
            " " +
            (
                error.message ||
                ""
            )
        );

    }

}

   INITIAL LANGUAGE
========================================================= */

updateStaticTranslations();

updateLanguageButton();


/* =========================================================
   START
========================================================= */

loadCourses();

</script>
